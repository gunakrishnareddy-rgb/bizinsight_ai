<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizInsight AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151C;
    --surface:#1A1F2B;
    --surface2:#212739;
    --line:#2C3345;
    --text:#E9EBF1;
    --muted:#8B92A8;
    --teal:#5FB8B0;
    --amber:#E3A24B;
    --red:#E06A6A;
    --green:#7BC08A;
  }
  *{box-sizing:border-box;}
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  nav.side{
    width:230px; flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:24px 16px;
    display:flex; flex-direction:column; gap:4px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 22px 8px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--amber)); display:flex;align-items:center;justify-content:center;font-weight:700;color:#0B0D12;font-size:14px;}
  .brand-name{font-weight:600; font-size:15px; letter-spacing:0.2px;}
  .brand-sub{font-size:11px; color:var(--muted); margin-top:1px;}
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--muted); font-size:13.5px; font-weight:500;
    transition:background .12s, color .12s;
  }
  .navitem:hover{background:var(--surface2); color:var(--text);}
  .navitem.active{background:var(--surface2); color:var(--text); box-shadow:inset 2px 0 0 var(--teal);}
  .navitem svg{width:16px;height:16px; opacity:.85;}
  .nav-spacer{flex:1;}
  .dataset-pill{
    margin-top:10px; padding:10px; border-radius:10px; background:var(--surface2);
    font-size:11.5px; color:var(--muted); border:1px solid var(--line);
  }
  .dataset-pill b{color:var(--text); display:block; font-size:12.5px; margin-bottom:2px;}

  /* Main */
  main{flex:1; padding:28px 36px; max-width:1180px;}
  .pagehead{margin-bottom:22px;}
  .pagehead h1{font-size:22px; font-weight:600; margin:0 0 4px 0;}
  .pagehead p{margin:0; color:var(--muted); font-size:13.5px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px;
  }
  .grid{display:grid; gap:14px;}
  .kpi-grid{grid-template-columns:repeat(auto-fit, minmax(190px,1fr));}
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px;
  }
  .kpi .label{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .kpi .value{font-size:24px; font-weight:600; font-family:'IBM Plex Mono',monospace;}
  .kpi .change{font-size:12px; margin-top:6px; display:flex; align-items:center; gap:4px;}
  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--muted);}

  .chart-grid{grid-template-columns:repeat(2,1fr); grid-auto-rows:minmax(300px,auto); margin-top:16px;}
  .chart-card h3{font-size:13.5px; font-weight:600; margin:0 0 12px 0; color:var(--text);}
  .chart-card .sub{font-size:11.5px; color:var(--muted); margin:-8px 0 12px 0;}
  canvas{max-height:260px;}

  /* Draggable / resizable dashboard grid */
  .kpi-grid{align-items:stretch;}
  .chart-card, .kpi{transition:box-shadow .12s, border-color .12s;}
  .chart-card.dragging, .kpi.dragging{opacity:.4;}
  .chart-card.drag-over, .kpi.drag-over{outline:2px dashed var(--teal); outline-offset:-2px;}
  .chart-card.xfilter-source{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset;}
  .grid-drag-handle{
    cursor:grab; color:var(--muted); font-size:13px; line-height:1; padding:2px 3px;
    user-select:none; flex-shrink:0; border-radius:4px;
  }
  .grid-drag-handle:hover{color:var(--text); background:var(--surface2);}
  .grid-drag-handle:active{cursor:grabbing;}
  .grid-resize-handle{
    position:absolute; right:2px; bottom:2px; width:15px; height:15px; cursor:nwse-resize;
    opacity:.45; z-index:2;
  }
  .grid-resize-handle:hover{opacity:.9;}
  .grid-resize-handle::after{
    content:''; position:absolute; right:2px; bottom:2px; width:8px; height:8px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
  }
  .xfilter-seg{transition:opacity .12s;}
  .xfilter-bar{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--teal);
    background:var(--surface2); border:1px solid var(--teal); border-radius:8px;
    padding:6px 10px; margin-bottom:12px;
  }
  .xfilter-bar .clear-x{cursor:pointer; text-decoration:underline; color:var(--text);}
  .xfilter-bar .dot{width:6px;height:6px;border-radius:50%; background:var(--teal); flex-shrink:0;}

  /* Upload */
  .upload-zone{
    border:1.5px dashed var(--line); border-radius:14px; padding:48px 24px;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
    background:var(--surface);
  }
  .upload-zone:hover, .upload-zone.drag{border-color:var(--teal); background:var(--surface2);}
  .upload-zone h2{font-size:17px; margin:14px 0 6px 0; font-weight:600;}
  .upload-zone p{color:var(--muted); font-size:13px; margin:0;}
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--teal); color:#0B1210; border:none; border-radius:8px;
    padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--surface2);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .row-gap{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{color:var(--muted); font-weight:500; font-size:11.5px;}
  td{font-family:'IBM Plex Mono',monospace;}
  .table-wrap{overflow-x:auto; margin-top:10px; max-height:420px; overflow-y:auto;}

  .badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600;}
  .badge.high{background:rgba(224,106,106,.15); color:var(--red);}
  .badge.medium{background:rgba(227,162,75,.15); color:var(--amber);}
  .badge.low{background:rgba(123,192,138,.15); color:var(--green);}

  .insight{border-bottom:1px solid var(--line); padding:16px 0;}
  .insight:last-child{border-bottom:none;}
  .insight-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .insight-head h4{margin:0; font-size:14px; font-weight:600;}
  .insight p{margin:4px 0; font-size:13px; color:var(--text); line-height:1.5;}
  .insight .field-label{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; margin-top:8px;}

  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px; color:var(--muted); text-align:center; gap:10px;
  }
  .empty svg{opacity:.4; width:40px;height:40px;}

  /* Chat */
  .chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 140px);}
  .chat-log{flex:1; overflow-y:auto; padding:6px 2px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:78%; padding:11px 14px; border-radius:12px; font-size:13.5px; line-height:1.5;}
  .msg.user{align-self:flex-end; background:var(--teal); color:#0B1210; border-bottom-right-radius:3px;}
  .msg.bot{align-self:flex-start; background:var(--surface2); border:1px solid var(--line); border-bottom-left-radius:3px; white-space:pre-wrap;}
  .chat-input{display:flex; gap:10px; margin-top:14px;}
  .chat-input input{
    flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:9px;
    padding:11px 14px; color:var(--text); font-family:inherit; font-size:13.5px;
  }
  .chat-input input:focus{outline:none; border-color:var(--teal);}
  .suggest{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .suggest span{
    font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:20px;
    padding:5px 12px; cursor:pointer;
  }
  .suggest span:hover{color:var(--text); border-color:var(--teal);}

  .quality-score{display:flex; align-items:center; gap:16px;}
  .score-ring{width:72px;height:72px; border-radius:50%; display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:18px; flex-shrink:0;}
  .filter-bar{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
  select{
    background:var(--surface2); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:12.5px; font-family:inherit;
    transition:border-color .15s ease, background .15s ease;
  }
  select:hover, input[type="date"]:hover{border-color:var(--teal); background:var(--surface2);}
  select:focus, input[type="date"]:focus{outline:none; border-color:var(--teal);}
  input[type="date"]{
    background:var(--surface2); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:6.5px 8px; font-size:12.5px; font-family:inherit; color-scheme: dark;
    transition:border-color .15s ease, background .15s ease;
  }
  .filter-bar-card{padding:14px 18px 16px 18px;}
  .filter-field{display:flex; flex-direction:column; gap:5px; position:relative;}
  .filter-field label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600;}
  .filter-range{display:flex; align-items:center; gap:6px;}
  .filter-range span{font-size:11px; color:var(--muted);}
  .filter-clear-field{margin-left:auto;}
  .filter-indicator{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    font-size:12px; color:var(--teal); font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .filter-indicator .dot{width:6px;height:6px;border-radius:50%; background:var(--teal); flex-shrink:0;}
  .filter-empty-note{font-size:12.5px; color:var(--muted);}
  .filter-chip-trigger{background:var(--surface2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6.5px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis;}
  .filter-chip-trigger:hover{border-color:var(--teal);}
  .filter-check-panel{position:absolute; margin-top:6px; z-index:40; background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; min-width:180px; max-width:260px; max-height:260px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .filter-check-panel label{display:flex; align-items:center; gap:7px; font-size:12.5px; padding:4px 0; cursor:pointer; white-space:nowrap;}
  .filter-check-panel input[type=checkbox]{accent-color:var(--teal); flex-shrink:0;}
  .filter-check-done{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:11.5px; color:var(--teal); font-weight:600; cursor:pointer; text-align:right;}
  @media (max-width: 760px){
    .filter-bar{flex-direction:column; align-items:stretch;}
    .filter-field{width:100%;}
    .filter-field select, .filter-field input[type="date"]{width:100%;}
    .filter-clear-field{margin-left:0;}
    .filter-clear-field .btn{width:100%; justify-content:center;}
  }
  .section-title{font-size:15px; font-weight:600; margin:26px 0 12px 0;}
  .loading-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25); border-top-color:#0B1210; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media print{
    body.printing-report nav.side, body.printing-report .row-gap, body.printing-report .pagehead{display:none !important;}
    body.printing-report main{padding:0; max-width:none;}
    body.printing-report{background:#fff; color:#111;}
    body.printing-report .card{background:#fff; border-color:#ddd; color:#111; box-shadow:none;}
    body.printing-report th, body.printing-report td{border-color:#ddd; color:#111;}

    body.printing-dashboard nav.side, body.printing-dashboard .row-gap, body.printing-dashboard .fields-panel,
    body.printing-dashboard .visual-menu-btn, body.printing-dashboard .visual-menu{display:none !important;}
    body.printing-dashboard main{padding:0; max-width:none;}
    body.printing-dashboard{background:#fff; color:#111;}
    body.printing-dashboard .card{background:#fff; border-color:#ddd; color:#111; box-shadow:none; break-inside:avoid;}
    body.printing-dashboard th, body.printing-dashboard td{border-color:#ddd; color:#111;}
    body.printing-dashboard .chart-grid, body.printing-dashboard .kpi-grid{display:block;}
    body.printing-dashboard .chart-grid > *, body.printing-dashboard .kpi-grid > *{margin-bottom:14px;}
  }
  .fact-tag{font-size:10px; text-transform:uppercase; letter-spacing:.5px; padding:2px 7px; border-radius:4px; font-weight:600;}
  .fact-tag.fact{background:rgba(95,184,176,.15); color:var(--teal);}
  .fact-tag.interp{background:rgba(227,162,75,.15); color:var(--amber);}

  /* Custom Dashboard */
  .field-chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:16px; background:var(--surface2); border:1px solid var(--line); font-size:11.5px; color:var(--text); cursor:grab; user-select:none;}
  .field-chip:active{cursor:grabbing;}
  .field-chip::before{content:''; width:6px; height:6px; border-radius:2px; background:var(--muted); display:inline-block; flex-shrink:0;}
  .field-chip.measure{border-color:rgba(95,184,176,.45); color:var(--teal);}
  .field-chip.measure::before{background:var(--teal);}
  .fields-panel{width:216px; flex-shrink:0; position:sticky; top:16px; align-self:flex-start;}
  .dropzone{border:1.5px dashed var(--line); border-radius:9px; padding:9px 11px; min-height:20px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; transition:border-color .12s, background .12s;}
  .dropzone.dragover{border-color:var(--teal); background:rgba(95,184,176,.1);}
  .dropzone .dz-value{font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dropzone .dz-placeholder{color:var(--muted); font-weight:400;}
  .dropzone .dz-clear{cursor:pointer; color:var(--muted); font-size:15px; line-height:1; flex-shrink:0;}
  .dropzone .dz-clear:hover{color:var(--red);}
  .visual-menu-btn{cursor:pointer; padding:3px 7px; border-radius:6px; color:var(--muted); font-size:16px; line-height:1; flex-shrink:0;}
  .visual-menu-btn:hover{background:var(--surface2); color:var(--text);}
  .visual-menu{position:absolute; right:14px; top:40px; background:var(--surface2); border:1px solid var(--line); border-radius:9px; min-width:150px; z-index:30; box-shadow:0 10px 30px rgba(0,0,0,.4); overflow:hidden;}
  .visual-menu div{padding:9px 13px; font-size:12.5px; cursor:pointer; color:var(--text);}
  .visual-menu div:hover{background:var(--surface);}
  .visual-menu div.danger{color:var(--red);}
  .modal-overlay{position:fixed; inset:0; background:rgba(6,8,12,.62); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; overflow-y:auto;}
  .modal-panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 24px; width:100%; max-width:640px; max-height:90vh; overflow-y:auto;}
  .modal-panel.wide{max-width:840px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-head h3{margin:0; font-size:16px;}
  .editor-row{margin-bottom:14px;}
  .editor-row label{display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600; margin-bottom:6px;}
  .editor-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){ .editor-grid{grid-template-columns:1fr;} .fields-panel{display:none;} }
  .editor-input{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--text); font-family:inherit; font-size:13px;}
  select.editor-select{width:100%; margin-top:6px;}

  /* Add Slicer popover + slicer-type variants */
  .add-slicer-wrap{position:relative;}
  .add-slicer-panel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:41; background:var(--surface2);
    border:1px solid var(--line); border-radius:10px; padding:12px; width:230px;
    box-shadow:0 10px 30px rgba(0,0,0,.45); display:flex; flex-direction:column; gap:9px;
  }
  .add-slicer-panel label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600;}
  .add-slicer-panel select{width:100%;}
  .checklist-inline{display:flex; flex-direction:column; gap:3px; max-height:150px; overflow-y:auto; padding:8px 10px; background:var(--surface2); border:1px solid var(--line); border-radius:8px; min-width:160px;}
  .checklist-inline label{display:flex; align-items:center; gap:7px; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  .checklist-inline input[type=checkbox]{accent-color:var(--teal); flex-shrink:0;}
  .filter-search-box{width:100%; margin-bottom:6px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:5px 8px; color:var(--text); font-size:12px; font-family:inherit;}
  .quick-date-row{display:flex; gap:6px; flex-wrap:wrap;}
  .quick-date-btn{font-size:11px; padding:5px 10px; border-radius:16px; background:var(--surface2); border:1px solid var(--line); color:var(--muted); cursor:pointer; white-space:nowrap;}
  .quick-date-btn:hover{border-color:var(--teal); color:var(--text);}
  .quick-date-btn.active{border-color:var(--teal); color:var(--teal); background:rgba(95,184,176,.1);}
  .rows-indicator{font-size:11.5px; color:var(--muted); font-weight:500; margin-left:auto;}
  .visual-filter-chip{display:inline-flex; align-items:center; gap:7px; padding:5px 10px; border-radius:14px; background:var(--surface2); border:1px solid var(--line); font-size:11.5px; color:var(--text);}
  .visual-filter-chip .dz-clear{cursor:pointer; color:var(--muted); font-size:14px; line-height:1;}
  .visual-filter-chip .dz-clear:hover{color:var(--red);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
const state = {
  page: 'home',
  fileName: null,
  fileSize: null,
  rows: [],
  columns: [], // {name, type, semantic}
  quality: null,
  kpis: [],
  charts: [],
  dateFilter: { year:'', month:'', date:'', rangeFrom:'', rangeTo:'' }, // global Year/Month/Date slicer state
  crossFilter: null, // Power-BI-style cross-filter: {column, value} set by clicking a chart segment; null = no selection
  insights: null, // AI generated {raw, error}
  recommendations: null,
  forecastExplanation: null, // AI generated {raw, error}
  loadingForecastExplain: false,
  chatHistory: [],
  filters: {},
  loadingInsights: false,
  loadingChat: false,
  datasetLabel: null,
  history: [],       // list of {id, name, uploadedAt, rows, columns, quality, kpis, charts, anomalies, insights, chatHistory, datasetLabel, fileSize, rawTables, activeTableName, modelRows, querySteps}
  currentId: null,
  rawTables: {},      // { sheetName: rows[] } — every sheet/table loaded from the source file, untouched
  activeTableName: null,
  modelRows: [],       // rows after Data Modeling (joins), before Power Query steps — the "Original Dataset" per spec
  querySteps: [],       // Power-Query-style Applied Steps, run against modelRows to produce state.rows (the "Cleaned Analysis Dataset")
  kpiTargets: {},        // { kpiLabel: targetNumber } — user-set goals for KPI/target tracking
  chartTitleOverrides: {}, // { chartKey: customTitle } — user-renamed auto-discovered chart titles (survive filter changes, since chartKey is derived from the chart's columns, not its auto-generated title)
  customDashboard: { visuals: null, kpis: null }, // Power-BI-style custom dashboard: null = not yet built for this dataset
  dashboardUI: { editingId:null, menuOpenId:null, maximizedId:null, showFields:true, editingKpiId:null, kpiMenuOpenId:null, addFilterOpen:false, openFilterId:null, addSlicerOpen:false, addSlicerCol:'', addSlicerType:'', quickDate:'', openVisualFilterId:null }, // custom dashboard UI state
  customFilters: [], // general-purpose slicer/filter builder — [{id,column,type,...}], ANDed together and applied on top of the date slicer
  aiConfig: {
    backendUrl: '',        // optional: URL of a user-deployed backend/serverless proxy that holds the real Anthropic key server-side
    lastError: null,
    lastTestResult: null,  // {ok:boolean, message:string, at:Date}
    testing: false,
  },
};

/* ============================= HISTORY ============================= */
function snapshotCurrent(){
  // save the live state back into its history entry, so insights/chat aren't lost when switching
  if (!state.currentId) return;
  const entry = state.history.find(h => h.id === state.currentId);
  if (!entry) return;
  Object.assign(entry, {
    rows: state.rows, columns: state.columns, quality: state.quality,
    kpis: state.kpis, charts: state.charts, anomalies: state.anomalies,
    insights: state.insights, chatHistory: state.chatHistory, forecastExplanation: state.forecastExplanation,
    datasetLabel: state.datasetLabel, fileName: state.fileName, fileSize: state.fileSize,
    rawTables: state.rawTables, activeTableName: state.activeTableName,
    modelRows: state.modelRows, querySteps: state.querySteps,
    customDashboard: state.customDashboard,
  });
}

function resetCustomFilters(){
  state.customFilters = [];
  state.dashboardUI.addFilterOpen = false;
  state.dashboardUI.openFilterId = null;
}

function pushToHistory(){
  const id = 'ds_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  state.history.unshift({
    id, name: state.fileName, uploadedAt: new Date(),
    rows: state.rows, columns: state.columns, quality: state.quality,
    kpis: state.kpis, charts: state.charts, anomalies: state.anomalies,
    insights: state.insights, chatHistory: state.chatHistory, forecastExplanation: state.forecastExplanation,
    datasetLabel: state.datasetLabel, fileSize: state.fileSize,
    rawTables: state.rawTables, activeTableName: state.activeTableName,
    modelRows: state.modelRows, querySteps: state.querySteps,
    customDashboard: state.customDashboard,
  });
  state.currentId = id;
}

function switchToDataset(id){
  snapshotCurrent();
  const entry = state.history.find(h => h.id === id);
  if (!entry) return;
  state.currentId = id;
  state.fileName = entry.name;
  state.fileSize = entry.fileSize;
  state.rows = entry.rows;
  state.columns = entry.columns;
  state.quality = entry.quality;
  state.kpis = entry.kpis;
  state.charts = entry.charts;
  state.anomalies = entry.anomalies;
  state.insights = entry.insights; state.forecastExplanation = entry.forecastExplanation || null;
  state.chatHistory = entry.chatHistory;
  state.datasetLabel = entry.datasetLabel;
  state.rawTables = entry.rawTables || {};
  state.activeTableName = entry.activeTableName || null;
  state.modelRows = entry.modelRows || entry.rows;
  state.querySteps = entry.querySteps || [];
  state.customDashboard = entry.customDashboard || { visuals: null, kpis: null };
  state.dashboardUI = { editingId:null, menuOpenId:null, maximizedId:null, showFields:true, editingKpiId:null, kpiMenuOpenId:null, addFilterOpen:false, openFilterId:null };
  state.crossFilter = null;
  resetDateFilter();
  resetCustomFilters();
  state.page = 'overview';
  render();
}

function renameDataset(id){
  const entry = state.history.find(h => h.id === id);
  if (!entry) return;
  const newName = prompt('Rename dataset', entry.name);
  if (newName && newName.trim()){
    entry.name = newName.trim();
    if (state.currentId === id) state.fileName = entry.name;
    render();
  }
}

function deleteDataset(id){
  if (!confirm('Remove this dataset from history? This only clears it from this session, not from your computer.')) return;
  state.history = state.history.filter(h => h.id !== id);
  if (state.currentId === id){
    state.currentId = null;
    state.rows = []; state.columns = []; state.quality = null; state.kpis = [];
    state.charts = []; state.anomalies = []; state.insights = null; state.chatHistory = [];
    state.fileName = null; state.datasetLabel = null;
    state.rawTables = {}; state.activeTableName = null; state.modelRows = []; state.querySteps = [];
    state.customDashboard = { visuals: null, kpis: null };
    state.dashboardUI = { editingId:null, menuOpenId:null, maximizedId:null, showFields:true, editingKpiId:null, kpiMenuOpenId:null, addFilterOpen:false, openFilterId:null };
    state.crossFilter = null;
    resetDateFilter();
    resetCustomFilters();
    state.page = state.history.length ? 'history' : 'home';
  }
  render();
}

function timeAgo(d){
  const diff = Math.floor((Date.now() - new Date(d).getTime())/1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return new Date(d).toLocaleDateString() + ' ' + new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

/* ============================= UTIL ============================= */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(1) + 'K';
  if (Number.isInteger(n)) return n.toString();
  return n.toFixed(2);
}
function isDateLike(v){
  if (v instanceof Date) return true;
  if (typeof v !== 'string') return false;
  if (!/\d{4}|\d{1,2}\/\d{1,2}|\d{1,2}-\d{1,2}/.test(v)) return false;
  const t = Date.parse(v);
  return !isNaN(t);
}

/* ============================= GLOBAL DATE / YEAR / MONTH SLICERS =============================
   Fully data-driven: no hardcoded years/months. Everything is derived from whichever column was
   auto-detected as type 'date' for the active dataset (see profileData). All comparisons use LOCAL
   calendar getters (not toISOString) so the "key" used to populate dropdown options is the exact
   same key used to filter rows — no timezone drift between what's offered and what's matched. */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function toDateSafe(v){
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  if (v === null || v === undefined || v === '') return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function dateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDateFriendly(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' });
}
function getDateColumn(columns){
  return (columns || []).find(c => c.type === 'date') || null;
}
function defaultDateFilter(){
  return { year:'', month:'', date:'', rangeFrom:'', rangeTo:'' };
}
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
// Relative/quick date presets (Power-BI-style "This Month" / "This Year" / rolling windows).
// Implemented as a Date Range under the hood, so they compose with everything the range slicer
// already drives (KPIs, charts, tables, AI insights, forecasts, recommendations).
function applyQuickDateFilter(preset){
  const now = new Date();
  state.dateFilter.year = ''; state.dateFilter.month = ''; state.dateFilter.date = '';
  if (preset === 'thisMonth') {
    state.dateFilter.rangeFrom = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
    state.dateFilter.rangeTo = ymd(new Date(now.getFullYear(), now.getMonth()+1, 0));
  } else if (preset === 'thisYear') {
    state.dateFilter.rangeFrom = ymd(new Date(now.getFullYear(), 0, 1));
    state.dateFilter.rangeTo = ymd(new Date(now.getFullYear(), 11, 31));
  } else if (preset === 'last30') {
    state.dateFilter.rangeFrom = ymd(new Date(now.getTime() - 29*86400000));
    state.dateFilter.rangeTo = ymd(now);
  } else if (preset === 'last90') {
    state.dateFilter.rangeFrom = ymd(new Date(now.getTime() - 89*86400000));
    state.dateFilter.rangeTo = ymd(now);
  } else { // 'all' / unknown = clear
    state.dateFilter.rangeFrom = ''; state.dateFilter.rangeTo = '';
  }
  state.dashboardUI.quickDate = preset === 'all' ? '' : preset;
}
function resetDateFilter(){
  state.dateFilter = defaultDateFilter();
  state.dashboardUI.quickDate = '';
}
// All valid Date objects found in a date column, once per dataset render pass.
function collectDates(rows, dateColName){
  return rows.map(r => toDateSafe(r[dateColName])).filter(Boolean);
}
// Years present anywhere in the dataset (independent of current month/date selection).
function getAvailableYears(dates){
  return Array.from(new Set(dates.map(d => d.getFullYear()))).sort((a,b)=>a-b);
}
// Months present for the currently-selected year (or across all years if none picked), in
// calendar (Jan→Dec) order — never a fixed list of 12, only months that actually occur.
function getAvailableMonths(dates, year){
  const scoped = year ? dates.filter(d => d.getFullYear() === Number(year)) : dates;
  const idxs = Array.from(new Set(scoped.map(d => d.getMonth()))).sort((a,b)=>a-b);
  return idxs.map(i => ({ idx: i, name: MONTH_NAMES[i] }));
}
// Individual dates present for the currently-selected year/month, cascading and sorted chronologically.
function getAvailableDateKeys(dates, year, month){
  let scoped = dates;
  if (year) scoped = scoped.filter(d => d.getFullYear() === Number(year));
  if (month !== '' && month !== null && month !== undefined) scoped = scoped.filter(d => d.getMonth() === Number(month));
  return Array.from(new Set(scoped.map(dateKey))).sort();
}
function isDateFilterActive(f){
  return !!(f.year || (f.month !== '' && f.month !== null && f.month !== undefined) || f.date || f.rangeFrom || f.rangeTo);
}
// Applies Year + Month + Date + Range together (all supplied conditions are ANDed), so combined
// selections like Year=2026 & Month=September behave as one narrowed slice, not separate filters.
function applyDateFilter(rows, dateColName, filter){
  if (!dateColName || !isDateFilterActive(filter)) return rows;
  const { year, month, date, rangeFrom, rangeTo } = filter;
  return rows.filter(r => {
    const d = toDateSafe(r[dateColName]);
    if (!d) return false;
    const k = dateKey(d);
    if (date && k !== date) return false;
    if (rangeFrom && k < rangeFrom) return false;
    if (rangeTo && k > rangeTo) return false;
    if (year && d.getFullYear() !== Number(year)) return false;
    if ((month !== '' && month !== null && month !== undefined) && d.getMonth() !== Number(month)) return false;
    return true;
  });
}
function describeDateFilter(f){
  if (f.date) return fmtDateFriendly(f.date);
  if (f.rangeFrom || f.rangeTo) {
    const from = f.rangeFrom ? fmtDateFriendly(f.rangeFrom) : 'earliest';
    const to = f.rangeTo ? fmtDateFriendly(f.rangeTo) : 'latest';
    return `${from} → ${to}`;
  }
  const hasMonth = f.month !== '' && f.month !== null && f.month !== undefined;
  if (f.year && hasMonth) return `${MONTH_NAMES[Number(f.month)]} ${f.year}`;
  if (f.year) return `Year ${f.year}`;
  if (hasMonth) return `${MONTH_NAMES[Number(f.month)]} (all years)`;
  return 'All Data';
}
// Renders the slicer bar (or a graceful "no date column" notice) and returns its HTML. Call
// bindDateFilterBar(main) right after inserting this into the DOM.
function renderDateFilterBar(){
  const dateCol = getDateColumn(state.columns);
  let dateHtml = `<div class="filter-empty-note">Date filters unavailable — no date column found.</div>`;
  if (dateCol) {
    const dates = collectDates(state.rows, dateCol.name);
    const f = state.dateFilter;
    const years = getAvailableYears(dates);
    const months = getAvailableMonths(dates, f.year);
    const dateKeys = getAvailableDateKeys(dates, f.year, f.month);
    dateHtml = `
      <div class="filter-field">
        <label>Year</label>
        <select id="flt-year">
          <option value="">All Years</option>
          ${years.map(y => `<option value="${y}" ${String(f.year)===String(y)?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div class="filter-field">
        <label>Month</label>
        <select id="flt-month">
          <option value="">All Months</option>
          ${months.map(m => `<option value="${m.idx}" ${String(f.month)===String(m.idx)?'selected':''}>${esc(m.name)}</option>`).join('')}
        </select>
      </div>
      <div class="filter-field">
        <label>Date</label>
        <select id="flt-date">
          <option value="">All Dates</option>
          ${dateKeys.map(k => `<option value="${k}" ${f.date===k?'selected':''}>${esc(fmtDateFriendly(k))}</option>`).join('')}
        </select>
      </div>
      <div class="filter-field">
        <label>Date Range</label>
        <div class="filter-range">
          <input type="date" id="flt-range-from" value="${esc(f.rangeFrom||'')}">
          <span>to</span>
          <input type="date" id="flt-range-to" value="${esc(f.rangeTo||'')}">
        </div>
      </div>
      <div class="filter-field">
        <label>Quick Ranges</label>
        <div class="quick-date-row">
          ${[['thisMonth','This Month'],['thisYear','This Year'],['last30','Last 30 Days'],['last90','Last 90 Days'],['all','All Time']].map(([id,label])=>
            `<span class="quick-date-btn ${state.dashboardUI.quickDate===id?'active':''}" data-quick-date="${id}">${label}</span>`
          ).join('')}
        </div>
      </div>`;
  }
  const anyActive = filtersActive();
  const total = state.rows.length, shown = getFilteredRows().length;
  return `
  <div class="card filter-bar-card" style="margin-bottom:16px;">
    <div class="filter-bar">
      ${dateHtml}
      ${renderCustomFilterFields()}
      <div class="filter-field add-slicer-wrap">
        <label>&nbsp;</label>
        <button class="btn ghost" id="open-add-slicer-btn" type="button">+ Add Slicer</button>
        ${state.dashboardUI.addSlicerOpen ? renderAddSlicerPanel() : ''}
      </div>
      ${dateCol || state.customFilters.length ? `<div class="filter-field filter-clear-field">
        <label>&nbsp;</label>
        <button class="btn ghost" id="flt-clear" type="button">Clear Filters</button>
      </div>` : ''}
      <span class="rows-indicator">${fmtNum(shown)} of ${fmtNum(total)} rows</span>
    </div>
    ${anyActive ? `<div class="filter-indicator"><span class="dot"></span>Showing: ${esc(describeDateFilter(state.dateFilter))}${state.customFilters.length?' · '+state.customFilters.map(describeCustomFilter).map(esc).join(' · '):''}</div>` : ''}
  </div>`;
}

// The "+ Add Slicer" popover: pick any column, then pick which Power-BI-style slicer widget to
// render for it (Dropdown / Multi-select / Searchable list / Checkbox-list for categorical
// columns; Numeric range / Date range are automatic for those column types).
function renderAddSlicerPanel(){
  const available = state.columns.filter(c => !state.customFilters.some(f=>f.column===c.name));
  const col = available.find(c=>c.name===state.dashboardUI.addSlicerCol) || available[0] || null;
  const type = col ? filterTypeForColumn(col) : 'text';
  const uiOptions = slicerUiTypeOptionsFor(type);
  if (col && !uiOptions.some(o=>o.id===state.dashboardUI.addSlicerType)) state.dashboardUI.addSlicerType = uiOptions[0].id;
  return `<div class="add-slicer-panel" id="add-slicer-panel">
    <div>
      <label>Field</label>
      <select id="add-slicer-col">
        ${available.length ? available.map(c=>`<option value="${esc(c.name)}" ${col&&col.name===c.name?'selected':''}>${esc(c.name)}</option>`).join('') : '<option value="">— no more fields —</option>'}
      </select>
    </div>
    ${col ? `<div>
      <label>Slicer Type</label>
      <select id="add-slicer-type">
        ${uiOptions.map(o=>`<option value="${o.id}" ${state.dashboardUI.addSlicerType===o.id?'selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>
    <button class="btn" id="add-slicer-confirm" type="button" style="justify-content:center;">Add Slicer</button>` : ''}
  </div>`;
}

// Shared renderer for both the global slicer bar (state.customFilters) and a single visual's
// own local filters (v.filters) — `p` namespaces the data-attributes so the two sets of event
// bindings never collide when a visual's editor modal is open on top of the dashboard.
function renderFilterFieldsGeneric(filters, openId, p){
  return (filters||[]).map(f => {
    const open = openId === f.id;
    let control = '';
    if (f.type === 'categorical' && f.uiType === 'dropdown') {
      const opts = columnUniqueValues(f.column, 300);
      control = `<select data-${p}filter-dropdown="${f.id}">
        <option value="">All</option>
        ${opts.map(v=>`<option value="${esc(v)}" ${f.selected[0]===v?'selected':''}>${esc(v)}</option>`).join('')}
      </select>`;
    } else if (f.type === 'categorical' && f.uiType === 'checklist') {
      const opts = columnUniqueValues(f.column, 200);
      control = `<div class="checklist-inline">
        ${opts.map(v => `<label><input type="checkbox" data-${p}filter-check="${f.id}" value="${esc(v)}" ${f.selected.includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}
      </div>`;
    } else if (f.type === 'categorical' && f.uiType === 'searchable') {
      const allOpts = columnUniqueValues(f.column, 500);
      const q = (f.checkSearch||'').toLowerCase();
      const opts = q ? allOpts.filter(v=>v.toLowerCase().includes(q)) : allOpts;
      control = `<div class="filter-chip-trigger" data-${p}filter-toggle="${f.id}">${esc(describeCustomFilter(f))} ▾</div>
        ${open ? `<div class="filter-check-panel">
          <input type="text" class="filter-search-box" placeholder="Search values…" data-${p}filter-searchbox="${f.id}" value="${esc(f.checkSearch||'')}">
          ${opts.map(v => `<label><input type="checkbox" data-${p}filter-check="${f.id}" value="${esc(v)}" ${f.selected.includes(v)?'checked':''}> ${esc(v)}</label>`).join('') || '<div style="font-size:11.5px;color:var(--muted);">No matches</div>'}
          <div class="filter-check-done" data-${p}filter-toggle="${f.id}">Done</div>
        </div>` : ''}`;
    } else if (f.type === 'categorical') { // multiselect (default)
      const opts = columnUniqueValues(f.column, 200);
      control = `<div class="filter-chip-trigger" data-${p}filter-toggle="${f.id}">${esc(describeCustomFilter(f))} ▾</div>
        ${open ? `<div class="filter-check-panel">
          ${opts.map(v => `<label><input type="checkbox" data-${p}filter-check="${f.id}" value="${esc(v)}" ${f.selected.includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}
          <div class="filter-check-done" data-${p}filter-toggle="${f.id}">Done</div>
        </div>` : ''}`;
    } else if (f.type === 'numeric') {
      const range = columnNumericRange(f.column);
      control = `<div class="filter-range">
        <input type="number" data-${p}filter-num="${f.id}:min" placeholder="Min (${fmtNum(range.min)})" value="${esc(f.min)}" style="width:88px;">
        <span>to</span>
        <input type="number" data-${p}filter-num="${f.id}:max" placeholder="Max (${fmtNum(range.max)})" value="${esc(f.max)}" style="width:88px;">
      </div>`;
    } else if (f.type === 'date') {
      control = `<div class="filter-range">
        <input type="date" data-${p}filter-date="${f.id}:from" value="${esc(f.from)}">
        <span>to</span>
        <input type="date" data-${p}filter-date="${f.id}:to" value="${esc(f.to)}">
      </div>`;
    } else {
      control = `<input type="text" class="editor-input" data-${p}filter-text="${f.id}" placeholder="Search…" value="${esc(f.search)}" style="width:150px;">`;
    }
    return `<div class="filter-field">
      <label>${esc(f.column)} <span class="dz-clear" data-${p}remove-filter="${f.id}" title="Remove filter">×</span></label>
      ${control}
    </div>`;
  }).join('');
}
function renderCustomFilterFields(){
  return renderFilterFieldsGeneric(state.customFilters, state.dashboardUI.openFilterId, '');
}
// Renders a single visual's own local filters (used only by that one chart), inside its editor modal.
function renderVisualFilterFields(v){
  return renderFilterFieldsGeneric(v.filters, state.dashboardUI.openVisualFilterId, 'v');
}

function bindDateFilterBar(main){
  const yearSel = main.querySelector('#flt-year');
  if (yearSel) {
    yearSel.addEventListener('change', e => {
      state.dateFilter.year = e.target.value;
      state.dateFilter.month = '';
      state.dateFilter.date = '';
      render();
    });
    main.querySelector('#flt-month').addEventListener('change', e => {
      state.dateFilter.month = e.target.value;
      state.dateFilter.date = '';
      render();
    });
    main.querySelector('#flt-date').addEventListener('change', e => {
      const val = e.target.value;
      state.dateFilter.date = val;
      if (val) {
        const [y,m] = val.split('-');
        state.dateFilter.year = y;
        state.dateFilter.month = String(Number(m)-1);
      }
      state.dateFilter.rangeFrom = ''; state.dateFilter.rangeTo = '';
      render();

      state.dateFilter.rangeFrom = e.target.value;
      state.dateFilter.date = '';

      state.dateFilter.rangeTo = e.target.value;
      state.dateFilter.date = '';
      render();
    });

  main.querySelectorAll('[data-quick-date]').forEach(el => el.addEventListener('click', () => {
    applyQuickDateFilter(el.getAttribute('data-quick-date'));
    render();
  }));
  main.querySelector('#flt-clear')?.addEventListener('click', () => {
    resetDateFilter();
    resetCustomFilters();
    render();
  });
  /* --- + Add Slicer popover: choose a field, then choose which Power-BI-style slicer widget
     to render for it (dropdown / multi-select / searchable list / checkbox-list, or the
     automatic numeric/date range) --- */
  main.querySelector('#open-add-slicer-btn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    state.dashboardUI.addSlicerOpen = !state.dashboardUI.addSlicerOpen;
    render();
  });
  main.querySelector('#add-slicer-panel')?.addEventListener('click', (e)=> e.stopPropagation());
  main.querySelector('#add-slicer-col')?.addEventListener('change', e => {
    state.dashboardUI.addSlicerCol = e.target.value;
    state.dashboardUI.addSlicerType = ''; // let renderAddSlicerPanel pick this column's first valid type
    render();
  });
  main.querySelector('#add-slicer-type')?.addEventListener('change', e => {
    state.dashboardUI.addSlicerType = e.target.value;
  });
  main.querySelector('#add-slicer-confirm')?.addEventListener('click', () => {
    const col = main.querySelector('#add-slicer-col')?.value || state.dashboardUI.addSlicerCol;
    if (!col) return;
    state.customFilters.push(makeCustomFilter(col, state.dashboardUI.addSlicerType));
    state.dashboardUI.addSlicerOpen = false;
    state.dashboardUI.addSlicerCol = '';
    state.dashboardUI.addSlicerType = '';

  });
  main.querySelectorAll('[data-remove-filter]').forEach(el => el.addEventListener('click', () => {
    state.customFilters = state.customFilters.filter(f => f.id !== el.getAttribute('data-remove-filter'));
    render();
  }));
  main.querySelectorAll('[data-filter-toggle]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = el.getAttribute('data-filter-toggle');
    state.dashboardUI.openFilterId = state.dashboardUI.openFilterId === id ? null : id;
    render();
  }));
  main.querySelectorAll('[data-filter-check]').forEach(el => el.addEventListener('change', () => {
    const id = el.getAttribute('data-filter-check');
    const f = state.customFilters.find(x=>x.id===id);
    if (!f) return;
    const v = el.value;
    if (el.checked) { if (!f.selected.includes(v)) f.selected.push(v); }
    else { f.selected = f.selected.filter(x=>x!==v); }
    render();
  }));
  main.querySelectorAll('[data-filter-dropdown]').forEach(el => el.addEventListener('change', () => {
    const id = el.getAttribute('data-filter-dropdown');
    const f = state.customFilters.find(x=>x.id===id);
    if (!f) return;
    f.selected = el.value ? [el.value] : [];
    render();
  }));
  main.querySelectorAll('[data-filter-searchbox]').forEach(el => {
    el.addEventListener('input', () => {
      const id = el.getAttribute('data-filter-searchbox');
      const f = state.customFilters.find(x=>x.id===id);
      if (f) f.checkSearch = el.value;
    });
    el.addEventListener('change', () => render());
  });
  main.querySelectorAll('[data-filter-num]').forEach(el => el.addEventListener('change', () => {
    const [id, part] = el.getAttribute('data-filter-num').split(':');
    const f = state.customFilters.find(x=>x.id===id);
    if (!f) return;
    f[part] = el.value;
    render();
  }));
  main.querySelectorAll('[data-filter-date]').forEach(el => el.addEventListener('change', () => {
    const [id, part] = el.getAttribute('data-filter-date').split(':');
    const f = state.customFilters.find(x=>x.id===id);
    if (!f) return;
    f[part] = el.value;
    render();
  }));
  main.querySelectorAll('[data-filter-text]').forEach(el => {
    el.addEventListener('input', () => {
      const id = el.getAttribute('data-filter-text');
      const f = state.customFilters.find(x=>x.id===id);
      if (f) f.search = el.value;
    });
    el.addEventListener('change', () => render());
  });
}
// The one place every data-consuming page should call to get "the rows in view" — applies the
// active Year/Month/Date/Range slicer, PLUS any general-purpose custom filters/slicers, on top of
// the cleaned dataset (state.rows). KPIs, charts, tables, AI insights, recommendations and chat all
// route through this function (or buildDataSummary, which itself calls this), so every filter type
// stays in sync everywhere.
function getFilteredRows(){
  let rows = state.rows;
  const dateCol = getDateColumn(state.columns);
  if (dateCol) rows = applyDateFilter(rows, dateCol.name, state.dateFilter);
  rows = applyCustomFilters(rows);
  if (state.crossFilter && state.crossFilter.column) {
    rows = rows.filter(r => xKeyForRow(r, state.crossFilter.column) === state.crossFilter.value);
  }
  return rows;
}
function clearCrossFilter(){ state.crossFilter = null; }

/* ============================= CUSTOM FILTER / SLICER BUILDER =============================
   General-purpose, data-driven filters on top of the date slicer. The control type is chosen
   automatically from the column's detected type — no hardcoded column names anywhere. */
function newFilterId(){ return 'f_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

function filterTypeForColumn(col){
  if (!col) return 'text';
  if (col.type === 'date') return 'date';
  if (col.type === 'numeric') return 'numeric';
  if (col.type === 'categorical') return 'categorical';
  return 'text'; // identifier / free text
}

// uiType (categorical columns only) chooses the Power-BI-style slicer widget:
// 'multiselect' (default — chip + checkbox popover), 'dropdown' (single value),
// 'searchable' (checkbox popover with a search box), 'checklist' (always-open inline list).
function slicerUiTypeOptionsFor(type){
  if (type === 'categorical') return [
    {id:'multiselect', label:'Multi-select'},
    {id:'dropdown', label:'Dropdown (single value)'},
    {id:'searchable', label:'Searchable list'},
    {id:'checklist', label:'Checkbox / list'},
  ];
  if (type === 'numeric') return [{id:'range', label:'Numeric range'}];
  if (type === 'date') return [{id:'range', label:'Date range'}];
  return [{id:'search', label:'Text search'}];
}
function makeCustomFilter(colName, uiType){
  const col = state.columns.find(c => c.name === colName);
  const type = filterTypeForColumn(col);
  const base = { id: newFilterId(), column: colName, type, uiType: uiType || (type==='categorical' ? 'multiselect' : (type==='text' ? 'search' : 'range')) };
  if (type === 'categorical') return Object.assign(base, { selected: [], checkSearch: '' }); // empty = all
  if (type === 'numeric') return Object.assign(base, { min: '', max: '' });
  if (type === 'date') return Object.assign(base, { from: '', to: '' });
  return Object.assign(base, { search: '' });
}

function columnUniqueValues(colName, limit){
  const vals = Array.from(new Set(state.rows.map(r => String(r[colName] ?? 'Unknown'))));
  vals.sort();
  return limit ? vals.slice(0, limit) : vals;
}
function columnNumericRange(colName){
  const nums = state.rows.map(r => parseFloat(r[colName])).filter(v => !isNaN(v));
  if (!nums.length) return { min:0, max:0 };
  return { min: Math.min(...nums), max: Math.max(...nums) };
}

function isCustomFilterActive(f){
  if (f.type === 'categorical') return !!(f.selected && f.selected.length);
  if (f.type === 'numeric') return (f.min !== '' && f.min !== null) || (f.max !== '' && f.max !== null);
  if (f.type === 'date') return !!(f.from || f.to);
  if (f.type === 'text') return !!f.search;
  return false;
}
function anyCustomFilterActive(){ return state.customFilters.some(isCustomFilterActive); }
function filtersActive(){ return isDateFilterActive(state.dateFilter) || anyCustomFilterActive(); }

function customFilterMatchesRow(row, f){
  const val = row[f.column];
  if (f.type === 'categorical') {
    if (!f.selected || !f.selected.length) return true;
    return f.selected.includes(String(val ?? 'Unknown'));
  }
  if (f.type === 'numeric') {
    const n = parseFloat(val);
    if (isNaN(n)) return false;
    if (f.min !== '' && f.min !== null && n < parseFloat(f.min)) return false;
    if (f.max !== '' && f.max !== null && n > parseFloat(f.max)) return false;
    return true;
  }
  if (f.type === 'date') {
    const d = toDateSafe(val);
    if (!d) return false;
    const k = dateKey(d);
    if (f.from && k < f.from) return false;
    if (f.to && k > f.to) return false;
    return true;
  }
  if (f.type === 'text') {
    if (!f.search) return true;
    return String(val ?? '').toLowerCase().includes(f.search.toLowerCase());
  }
  return true;
}
function applyFiltersList(rows, filters){
  if (!filters || !filters.length) return rows;
  return rows.filter(r => filters.every(f => customFilterMatchesRow(r, f)));
}
function applyCustomFilters(rows){
  return applyFiltersList(rows, state.customFilters);
}
function describeCustomFilter(f){
  if (f.type === 'categorical') return f.selected.length ? `${f.column}: ${f.selected.length===1?f.selected[0]:f.selected.length+' selected'}` : `${f.column}: all`;
  if (f.type === 'numeric') {
    if (f.min==='' && f.max==='') return `${f.column}: any`;
    return `${f.column}: ${f.min!==''?f.min:'min'}–${f.max!==''?f.max:'max'}`;
  }
  if (f.type === 'date') {
    if (!f.from && !f.to) return `${f.column}: any date`;
    return `${f.column}: ${f.from?fmtDateFriendly(f.from):'…'} → ${f.to?fmtDateFriendly(f.to):'…'}`;
  }
  if (f.type === 'text') return f.search ? `${f.column}: "${f.search}"` : `${f.column}: any`;
  return f.column;
}

/* ============================= DATA PROFILING ============================= */
function profileData(rows){
  const colNames = Object.keys(rows[0] || {});
  const columns = colNames.map(name => {
    const values = rows.map(r => r[name]).filter(v => v !== null && v !== undefined && v !== '');
    const sampleSize = Math.min(values.length, 200);
    const sample = values.slice(0, sampleSize);
    const numericCount = sample.filter(v => typeof v === 'number' || (!isNaN(parseFloat(v)) && isFinite(v) && String(v).trim() !== '')).length;
    const dateCount = sample.filter(isDateLike).length;
    const uniqueVals = new Set(values.map(v=>String(v)));
    const uniqueRatio = values.length ? uniqueVals.size / values.length : 0;

    let type = 'text';
    if (dateCount / (sample.length || 1) > 0.7) type = 'date';
    else if (numericCount / (sample.length || 1) > 0.85) type = 'numeric';
    else if (uniqueRatio > 0.92 && values.length > 10) type = 'identifier';
    else type = 'categorical';

    let semantic = null;
    const lname = name.toLowerCase();
    if (type === 'numeric') {
      if (/price|cost|amount|revenue|sales|salary|spend|budget|profit|expense|value|fee/.test(lname)) semantic = 'currency';
      else if (/rate|percent|%|ratio|pct/.test(lname)) semantic = 'percentage';
      else semantic = 'measure';
    } else if (type === 'categorical') {
      if (/region|country|city|location|state|address|zone/.test(lname)) semantic = 'geography';
      else if (/status|stage|state\b/.test(lname)) semantic = 'status';
      else semantic = 'dimension';
    } else if (type === 'date') semantic = 'time';
    else if (type === 'identifier') semantic = 'id';

    return { name, type, semantic, uniqueCount: uniqueVals.size, missing: rows.length - values.length };
  });

  // quality
  let totalCells = rows.length * columns.length;
  let missingCells = columns.reduce((a,c)=>a+c.missing,0);
  const seen = new Set();
  let dupCount = 0;
  rows.forEach(r => {
    const key = JSON.stringify(r);
    if (seen.has(key)) dupCount++; else seen.add(key);
  });
  const missingPct = totalCells ? missingCells/totalCells : 0;
  const dupPct = rows.length ? dupCount/rows.length : 0;
  let score = 100 - Math.round(missingPct*100*0.6) - Math.round(dupPct*100*0.8);
  score = Math.max(0, Math.min(100, score));

  const issues = [];
  if (missingCells > 0) issues.push(`${missingCells} missing value${missingCells===1?'':'s'} across ${columns.filter(c=>c.missing>0).length} column${columns.filter(c=>c.missing>0).length===1?'':'s'}.`);
  if (dupCount > 0) issues.push(`${dupCount} duplicate record${dupCount===1?'':'s'} detected.`);
  const emptyCols = columns.filter(c => c.missing === rows.length);
  if (emptyCols.length) issues.push(`${emptyCols.length} column(s) are entirely empty: ${emptyCols.map(c=>c.name).join(', ')}.`);
  if (issues.length === 0) issues.push('No major data quality issues detected.');

  return { columns, quality: { score, missingCells, dupCount, issues } };
}

/* ============================= DYNAMIC KPI + CHART DISCOVERY ============================= */
/* ============================= STRUCTURAL (domain-agnostic) HELPERS =============================
   No business vocabulary is matched here (no "sales", "profit", "customer", etc). Everything below
   is decided purely from column TYPES, NAME STRUCTURE, and VALUE SHAPE — so the same logic produces
   "Total Students"/"Average Marks" for a student file and "Total Properties"/"Average Rent" for a
   property file, with no per-industry branching. */

// A column is a plausible "row = one entity" identifier if it's an explicit identifier column,
// or a categorical/text column whose values are almost all unique across the rows.
function detectEntityColumn(rows, columns){
  const explicit = columns.find(c => c.type === 'identifier');
  if (explicit) return explicit;
  if (!rows.length) return null;
  const nearUnique = columns
    .filter(c => c.type === 'categorical')
    .find(c => (c.uniqueCount / rows.length) > 0.85);
  return nearUnique || null;
}

// Purely grammatical: strips generic identifier/name suffixes (id, code, name, number, key) that
// appear across every domain, then pluralizes. "Student Name"->"Students", "Property"->"Properties",
// "Employee ID"->"Employees". Never matches a business word.
function pluralizeWord(word){
  if (/[^aeiou]y$/i.test(word)) return word.slice(0,-1) + 'ies';
  if (/(s|x|z|ch|sh)$/i.test(word)) return word + 'es';
  if (/s$/i.test(word)) return word;
  return word + 's';
}
function entityLabelFromColumn(name){
  let n = String(name).replace(/[_\-]+/g, ' ').trim();
  n = n.replace(/\s*\b(id|no\.?|number|code|key|name)\b\s*$/i, '').trim();
  if (!n) n = 'Record';
  n = n.split(' ').filter(Boolean).map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
  return pluralizeWord(n);
}

function discoverKPIs(rows, columns, excludeNames, defaultToAverage){
  excludeNames = excludeNames || new Set();
  const numeric = columns.filter(c => c.type === 'numeric' && !excludeNames.has(c.name));
  const dateCol = columns.find(c => c.type === 'date');
  const kpis = [];

  numeric.slice(0,6).forEach(col => {
    const vals = rows.map(r => parseFloat(r[col.name])).filter(v => !isNaN(v));
    if (!vals.length) return;
    // Percentages always average (summing a rate is meaningless). Otherwise, default to average when
    // each row already represents one distinct entity (so the column is a per-entity attribute, like
    // a salary or a rent amount) — and to sum when rows are repeated events (so the column is a flow
    // quantity, like a transaction amount). This distinction comes only from row/entity shape.
    const useAverage = col.semantic === 'percentage' || !!defaultToAverage;
    const sum = vals.reduce((a,b)=>a+b,0);
    const avg = sum/vals.length;
    const displayValue = useAverage ? avg : sum;
    let change = null;
    if (dateCol) {
      const sorted = rows.map(r=>({d: new Date(r[dateCol.name]), v: parseFloat(r[col.name])}))
                          .filter(r=>!isNaN(r.d) && !isNaN(r.v)).sort((a,b)=>a.d-b.d);
      if (sorted.length > 4) {
        const mid = Math.floor(sorted.length/2);
        const firstHalf = sorted.slice(0,mid).reduce((a,r)=>a+r.v,0) / mid;
        const secondHalf = sorted.slice(mid).reduce((a,r)=>a+r.v,0) / (sorted.length-mid);
        if (firstHalf !== 0) change = ((secondHalf-firstHalf)/Math.abs(firstHalf))*100;
      }
    }
    kpis.push({
      label: useAverage ? `Average ${col.name}` : `Total ${col.name}`,
      value: displayValue, avgValue: avg, change, unit: col.semantic
    });
  });
  return kpis;
}

// The only "named" KPI: how many distinct entities this dataset is about, named after whatever
// identifier/near-unique column actually exists — never a fixed business noun.
function deriveEntityKPI(rows, columns){
  const entityCol = detectEntityColumn(rows, columns);
  if (!entityCol) return { kpis: [], used: new Set(), rowsPerEntity: false };
  const count = new Set(rows.map(r => r[entityCol.name]).filter(v => v!==null && v!==undefined && v!=='')).size;
  const label = `Total ${entityLabelFromColumn(entityCol.name)}`;
  return {
    kpis: [{ label, value: count, avgValue: count, change: null, unit: 'count' }],
    used: new Set([entityCol.name]),
    rowsPerEntity: true,
  };
}

function buildKPIs(rows, columns){
  const { kpis: named, used, rowsPerEntity } = deriveEntityKPI(rows, columns);
  const generic = discoverKPIs(rows, columns, used, rowsPerEntity);
  return [...named, ...generic].slice(0,8);
}

function discoverCharts(rows, columns){
  const numeric = columns.filter(c => c.type === 'numeric');
  const categorical = columns.filter(c => c.type === 'categorical');
  const dateCol = columns.find(c => c.type === 'date');
  const charts = [];
  const rowsPerEntity = !!detectEntityColumn(rows, columns);
  // For grouped aggregations (trend/bar/doughnut), prefer a genuinely summable (non-percentage) column,
  // and aggregate by average within each group when rows are one-per-entity (summing a per-entity
  // attribute like rent or marks across a whole category is not meaningful), by sum otherwise.
  const sumMetric = numeric.find(n => n.semantic !== 'percentage') || null;
  const aggLabel = rowsPerEntity ? 'Average' : 'Total';
  const aggregate = (vals) => { if (!vals.length) return 0; const s = vals.reduce((a,b)=>a+b,0); return rowsPerEntity ? s/vals.length : s; };


  // Trend chart if date + numeric
  if (dateCol && sumMetric) {
    const metric = sumMetric;
    const grouped = {};
    rows.forEach(r => {
      const d = new Date(r[dateCol.name]);
      if (isNaN(d)) return;
      const key = d.toISOString().slice(0,7); // month
      const v = parseFloat(r[metric.name]);
      if (isNaN(v)) return;
      (grouped[key] = grouped[key] || []).push(v);
    });
    const keys = Object.keys(grouped).sort();
    if (keys.length > 1) {
      charts.push({ type:'line', key:`trend_${metric.name}_${dateCol.name}`, title:`${metric.name} over time`, sub:`Monthly ${aggLabel.toLowerCase()}, grouped by ${dateCol.name}`,
        labels: keys, data: keys.map(k=>aggregate(grouped[k])) });
    }
  }

  // Bar chart: categorical breakdown by first summable numeric measure (or record count)
  categorical.slice(0,2).forEach(cat => {
    const counts = {};
    const groups = {};
    const metric = sumMetric;
    rows.forEach(r => {
      const key = String(r[cat.name] ?? 'Unknown');
      counts[key] = (counts[key]||0) + 1;
      if (metric) {
        const v = parseFloat(r[metric.name]);
        if (!isNaN(v)) (groups[key] = groups[key] || []).push(v);
      }
    });
    const aggregated = {}; Object.keys(groups).forEach(k => aggregated[k] = aggregate(groups[k]));
    let entries = Object.entries(metric ? aggregated : counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if (entries.length >= 2) {
      charts.push({
        type:'bar',
        key: `bar_${cat.name}_${metric ? metric.name : 'count'}`,
        title: metric ? `${aggLabel} ${metric.name} by ${cat.name}` : `Record count by ${cat.name}`,
        sub: `Top ${entries.length} ${cat.name} values`,
        labels: entries.map(e=>e[0]), data: entries.map(e=>e[1])
      });
    }
  });

  // Composition (donut) chart: share of the whole across a categorical column. A "share" only makes
  // strict sense as a partition of a total, so this always uses record-count share when rows are
  // one-per-entity (e.g. "share of properties by location"), and sum-of-metric share otherwise
  // (e.g. "share of transaction amount by region") — never a share of an average.
  if (categorical.length) {
    const cat = categorical[0];
    const metric = rowsPerEntity ? null : sumMetric;
    const counts = {}, sums = {};
    rows.forEach(r => {
      const key = String(r[cat.name] ?? 'Unknown');
      counts[key] = (counts[key]||0) + 1;
      if (metric) { const v = parseFloat(r[metric.name]); if (!isNaN(v)) sums[key] = (sums[key]||0) + v; }
    });
    let entries = Object.entries(metric ? sums : counts).sort((a,b)=>b[1]-a[1]);
    if (entries.length > 6) {
      const top = entries.slice(0,5);
      const restSum = entries.slice(5).reduce((a,e)=>a+e[1],0);
      entries = [...top, ['Other', restSum]];
    }
    if (entries.length >= 2 && entries.length <= 8) {
      charts.push({
        type:'doughnut',
        key: `donut_${cat.name}_${metric ? metric.name : 'count'}`,
        title: metric ? `Share of ${metric.name} by ${cat.name}` : `Share of records by ${cat.name}`,
        sub: 'Composition breakdown',
        labels: entries.map(e=>e[0]), data: entries.map(e=>e[1])
      });
    }
  }

  // Scatter: relationship between two numeric columns
  if (numeric.length >= 2) {
    const [a, b] = numeric;
    const points = rows.map(r => ({ x: parseFloat(r[a.name]), y: parseFloat(r[b.name]) }))
                        .filter(p => !isNaN(p.x) && !isNaN(p.y));
    if (points.length >= 8) {
      charts.push({
        type:'scatter',
        key: `scatter_${a.name}_${b.name}`,
        title: `${a.name} vs ${b.name}`,
        sub: 'Relationship between the two measures',
        points: points.slice(0,400),
        xLabel: a.name, yLabel: b.name
      });
    }
  }

  // Distribution for a numeric column with no date/categorical charts yet
  if (numeric.length && charts.length < 3) {
    const metric = numeric[numeric.length > 1 ? 1 : 0];
    const vals = rows.map(r=>parseFloat(r[metric.name])).filter(v=>!isNaN(v));
    if (vals.length > 5) {
      const min = Math.min(...vals), max = Math.max(...vals);
      const buckets = 8;
      const size = (max-min)/buckets || 1;
      const hist = Array(buckets).fill(0);
      vals.forEach(v => { let idx = Math.min(buckets-1, Math.floor((v-min)/size)); hist[idx]++; });
      charts.push({
        type:'bar',
        key: `dist_${metric.name}`,
        title:`Distribution of ${metric.name}`,
        sub:'Value ranges across all records',
        labels: hist.map((_,i)=>`${fmtNum(min+i*size)}–${fmtNum(min+(i+1)*size)}`),
        data: hist
      });
    }
  }

  return charts.slice(0,6).map(applyChartTitleOverride);
}

// A custom title (set via the Rename control on a chart card) is keyed by the chart's underlying
// columns, not its auto-generated title, so it survives discoverCharts() being re-run with a new
// title/sub whenever the date slicer or a custom filter changes the rows.
function applyChartTitleOverride(c){
  if (c.key && state.chartTitleOverrides[c.key]) return Object.assign({}, c, { customTitle: true, title: state.chartTitleOverrides[c.key] });
  return c;
}

/* ============================= FORECASTING (simple linear trend) ============================= */
function linearRegression(ys){
  const n = ys.length;
  const xs = ys.map((_,i)=>i);
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((a,x,i)=>a+x*ys[i],0), sumXX = xs.reduce((a,x)=>a+x*x,0);
  const denom = (n*sumXX - sumX*sumX) || 1;
  const slope = (n*sumXY - sumX*sumY) / denom;
  const intercept = (sumY - slope*sumX) / n;
  return { slope, intercept };
}
function computeForecast(rows, columns, periodsAhead){
  const dateCol = columns.find(c => c.type === 'date');
  const numeric = columns.filter(c => c.type === 'numeric');
  const metric = numeric.find(n => n.semantic !== 'percentage') || numeric[0];
  if (!dateCol || !metric) return null;
  const grouped = {};
  rows.forEach(r => {
    const d = new Date(r[dateCol.name]);
    if (isNaN(d)) return;
    const key = d.toISOString().slice(0,7);
    const v = parseFloat(r[metric.name]);
    if (isNaN(v)) return;
    grouped[key] = (grouped[key]||0) + v;
  });
  const keys = Object.keys(grouped).sort();
  if (keys.length < 4) return null;
  const values = keys.map(k => grouped[k]);
  const { slope, intercept } = linearRegression(values);
  const forecastLabels = [], forecastValues = [];
  for (let i=0;i<periodsAhead;i++){
    const idx = values.length + i;
    forecastValues.push(Math.max(0, slope*idx + intercept));
    const lastDate = new Date(keys[keys.length-1] + '-01');
    lastDate.setMonth(lastDate.getMonth() + i + 1);
    forecastLabels.push(lastDate.toISOString().slice(0,7));
  }
  // simple confidence signal from how well the line actually fits the historical points
  const meanY = values.reduce((a,b)=>a+b,0)/values.length;
  const ssTot = values.reduce((a,v)=>a+(v-meanY)**2,0) || 1;
  const ssRes = values.reduce((a,v,i)=>a+(v-(slope*i+intercept))**2,0);
  const r2 = Math.max(0, 1 - ssRes/ssTot);
  return { metricName: metric.name, historyLabels: keys, historyValues: values, forecastLabels, forecastValues, slope, r2 };
}

/* ============================= RANKINGS ============================= */
function computeTopN(rows, columns, n){
  const categorical = columns.filter(c => c.type === 'categorical');
  const numeric = columns.filter(c => c.type === 'numeric');
  if (!categorical.length) return null;
  const cat = categorical[0];
  const metric = numeric.find(m => m.semantic !== 'percentage') || null;
  const agg = {};
  rows.forEach(r => {
    const key = String(r[cat.name] ?? 'Unknown');
    const v = metric ? parseFloat(r[metric.name]) : 1;
    agg[key] = (agg[key]||0) + (metric ? (isNaN(v)?0:v) : 1);
  });
  const total = Object.values(agg).reduce((a,b)=>a+b,0) || 1;
  const entries = Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,n);
  return { dimension: cat.name, metricName: metric ? metric.name : 'Record count', rows: entries.map(([k,v])=>({ name:k, value:v, share: v/total*100 })) };
}

/* ============================= SEGMENT COMPARISON ============================= */
function compareSegments(rows, columns, catCol, valA, valB){
  const numeric = columns.filter(c => c.type === 'numeric');
  const groupA = rows.filter(r => String(r[catCol]) === valA);
  const groupB = rows.filter(r => String(r[catCol]) === valB);
  const metrics = numeric.map(col => {
    const isRate = col.semantic === 'percentage';
    const valsA = groupA.map(r=>parseFloat(r[col.name])).filter(v=>!isNaN(v));
    const valsB = groupB.map(r=>parseFloat(r[col.name])).filter(v=>!isNaN(v));
    const aggA = valsA.length ? (isRate ? valsA.reduce((a,b)=>a+b,0)/valsA.length : valsA.reduce((a,b)=>a+b,0)) : 0;
    const aggB = valsB.length ? (isRate ? valsB.reduce((a,b)=>a+b,0)/valsB.length : valsB.reduce((a,b)=>a+b,0)) : 0;
    const pctDiff = aggA !== 0 ? ((aggB-aggA)/Math.abs(aggA))*100 : null;
    return { name: col.name, isRate, a: aggA, b: aggB, pctDiff };
  });
  return { countA: groupA.length, countB: groupB.length, metrics };
}

/* ============================= ANOMALY DETECTION ============================= */
function detectAnomalies(rows, columns){
  const numeric = columns.filter(c => c.type === 'numeric');
  const anomalies = [];
  numeric.forEach(col => {
    const vals = rows.map(r=>parseFloat(r[col.name])).filter(v=>!isNaN(v));
    if (vals.length < 5) return;
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const std = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    if (std === 0) return;
    rows.forEach((r,i) => {
      const v = parseFloat(r[col.name]);
      if (isNaN(v)) return;
      const z = (v-mean)/std;
      if (Math.abs(z) > 3) {
        anomalies.push({ column: col.name, row: i, value: v, z: z.toFixed(1), direction: z>0?'unusually high':'unusually low' });
      }
    });
  });
  return anomalies.slice(0,10);
}

/* ============================= DATA MODELING (table relationships / merge) ============================= */
function mergeTables(baseRows, baseKey, joinRows, joinKey, joinTableName){
  const idx = {};
  joinRows.forEach(r => { const k = String(r[joinKey]); if (!(k in idx)) idx[k] = r; });
  return baseRows.map(r => {
    const k = String(r[baseKey]);
    const match = idx[k];
    const merged = { ...r };
    if (match) {
      Object.keys(match).forEach(col => {
        if (col === joinKey) return;
        const newKey = (col in merged) ? `${joinTableName}_${col}` : col;
        merged[newKey] = match[col];
      });
    }
    return merged;
  });
}

/* ============================= POWER QUERY (Applied Steps transformation engine) ============================= */
function applyStep(rows, step){
  switch(step.type){
    case 'removeColumn':
      return rows.map(r => { const c = {...r}; delete c[step.col]; return c; });
    case 'rename':
      return rows.map(r => {
        const c = {...r};
        if (step.col in c) { c[step.newName] = c[step.col]; if (step.newName !== step.col) delete c[step.col]; }
        return c;
      });
    case 'changeType':
      return rows.map(r => {
        const c = {...r};
        const v = c[step.col];
        if (v === null || v === undefined || v === '') return c;
        if (step.target === 'number') { const n = parseFloat(v); c[step.col] = isNaN(n) ? null : n; }
        else if (step.target === 'text') { c[step.col] = String(v); }
        else if (step.target === 'date') { const d = new Date(v); c[step.col] = isNaN(d) ? null : d.toISOString().slice(0,10); }
        return c;
      });
    case 'filter':
      return rows.filter(r => {
        const v = r[step.col];
        const target = step.value;
        if (step.op === 'notEmpty') return v !== null && v !== undefined && v !== '';
        if (v === null || v === undefined || v === '') return false;
        if (step.op === 'equals') return String(v).toLowerCase() === String(target).toLowerCase();
        if (step.op === 'contains') return String(v).toLowerCase().includes(String(target).toLowerCase());
        if (step.op === 'greater') return parseFloat(v) > parseFloat(target);
        if (step.op === 'less') return parseFloat(v) < parseFloat(target);
        return true;
      });
    case 'dedupe': {
      const seen = new Set(); const out = [];
      rows.forEach(r => { const k = JSON.stringify(r); if (!seen.has(k)) { seen.add(k); out.push(r); } });
      return out;
    }
    case 'fillMissing':
      if (step.method === 'fixed') {
        return rows.map(r => { const c={...r}; if (c[step.col]===null||c[step.col]===undefined||c[step.col]==='') c[step.col]=step.value; return c; });
      } else if (step.method === 'zero') {
        return rows.map(r => { const c={...r}; if (c[step.col]===null||c[step.col]===undefined||c[step.col]==='') c[step.col]=0; return c; });
      } else if (step.method === 'forward') {
        let last = null; const out=[];
        rows.forEach(r => {
          const c={...r};
          if (c[step.col]===null||c[step.col]===undefined||c[step.col]==='') { if (last!==null) c[step.col]=last; }
          else last = c[step.col];
          out.push(c);
        });
        return out;
      }
      return rows;
    case 'trimText':
      return rows.map(r => {
        const c={...r};
        Object.keys(c).forEach(k => { if (typeof c[k] === 'string') c[k] = c[k].trim(); });
        return c;
      });
    // Self-service calculated column — this is how a user builds their OWN metric (Profit, Margin
    // %, Cost per Unit, whatever the dataset calls for) without touching any code. Two numeric
    // columns combined with +/-/×/÷, a numeric column combined with a constant, or a numeric
    // column expressed as its % share of its own column total. Nothing here is tied to any
    // specific business column name — colA/colB/name are all user-chosen at click time.
    case 'addColumn':
      if (step.op === 'pctTotal') {
        const total = rows.reduce((s,r) => { const n = parseFloat(r[step.colA]); return s + (isNaN(n) ? 0 : n); }, 0);
        return rows.map(r => {
          const c = {...r};
          const n = parseFloat(r[step.colA]);
          c[step.name] = (total && !isNaN(n)) ? (n / total * 100) : 0;
          return c;
        });
      }
      return rows.map(r => {
        const c = {...r};
        const a = parseFloat(r[step.colA]);
        const b = step.operandType === 'constant' ? parseFloat(step.constant) : parseFloat(r[step.colB]);
        let result = null;
        if (!isNaN(a) && !isNaN(b)) {
          if (step.op === '+') result = a + b;
          else if (step.op === '-') result = a - b;
          else if (step.op === '*') result = a * b;
          else if (step.op === '/') result = b !== 0 ? a / b : null;
        }
        c[step.name] = result;
        return c;
      });
    default:
      return rows;
  }
}
function applySteps(baseRows, steps){
  return steps.reduce((rows, step) => applyStep(rows, step), baseRows);
}
function stepLabel(step){
  switch(step.type){
    case 'removeColumn': return `Removed column "${step.col}"`;
    case 'rename': return `Renamed "${step.col}" → "${step.newName}"`;
    case 'changeType': return `Changed type of "${step.col}" → ${step.target}`;
    case 'filter': return `Filtered rows: ${step.col} ${step.op} ${step.op==='notEmpty'?'':('"'+step.value+'"')}`;
    case 'dedupe': return `Removed duplicate rows`;
    case 'fillMissing': return `Filled missing in "${step.col}" (${step.method}${step.method==='fixed'?': '+step.value:''})`;
    case 'trimText': return `Trimmed whitespace in all text columns`;
    case 'addColumn': {
      if (step.op === 'pctTotal') return `Added column "${step.name}" = ${step.colA} as % of its total`;
      const opSym = {'+':'+','-':'−','*':'×','/':'÷'}[step.op] || step.op;
      const rightSide = step.operandType === 'constant' ? step.constant : step.colB;
      return `Added column "${step.name}" = ${step.colA} ${opSym} ${rightSide}`;
    }
    default: return step.type;
  }
}
function addQueryStep(step){
  state.querySteps.push(step);
  const result = applySteps(state.modelRows, state.querySteps);
  reprocessRows(result);
  state.insights = null; state.chatHistory = [];
  snapshotCurrent();
  render();
}
function removeQueryStep(idx){
  state.querySteps.splice(idx,1);
  const result = applySteps(state.modelRows, state.querySteps);
  reprocessRows(result);
  state.insights = null; state.chatHistory = [];
  snapshotCurrent();
  render();
}
function resetQuerySteps(){
  if (!confirm('Clear all applied steps and revert to the modeled data before cleanup?')) return;
  state.querySteps = [];
  reprocessRows(state.modelRows);
  state.insights = null; state.chatHistory = [];
  snapshotCurrent();
  render();
}
