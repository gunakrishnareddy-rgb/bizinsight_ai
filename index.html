/* ============================= SVG CHART RENDERERS (no external library) ============================= */
const PALETTE = ['#5FB8B0','#E3A24B','#7BC08A','#E06A6A','#8B92A8','#9B8AE0','#5FA8E0','#E0A0D0'];
function truncateLabel(s, n){ s = String(s); return s.length > n ? s.slice(0,n-1)+'…' : s; }

function svgBar(labels, data, color){
  const W=560,H=230,padL=42,padB=56,padT=14,padR=10;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const max=Math.max(...data,0), min=Math.min(0,Math.min(...data));
  const range=(max-min)||1;
  const n=data.length, gap=plotW/n, barW=Math.min(gap*0.6, 46);
  let bars='', labelsSvg='';
  data.forEach((v,i)=>{
    const x = padL + i*gap + (gap-barW)/2;
    const zeroY = padT + plotH - ((0-min)/range)*plotH;
    const valY = padT + plotH - ((v-min)/range)*plotH;
    const y = Math.min(zeroY,valY), h = Math.max(Math.abs(zeroY-valY),1);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" fill-opacity="0.85"/>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9" fill="#8B92A8" text-anchor="middle" font-family="IBM Plex Mono, monospace">${esc(fmtNum(v))}</text>`;
    const cx = x+barW/2;
    labelsSvg += `<text x="${cx.toFixed(1)}" y="${(H-padB+16).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="end" font-family="IBM Plex Sans, sans-serif" transform="rotate(-30 ${cx.toFixed(1)} ${(H-padB+16).toFixed(1)})">${esc(truncateLabel(labels[i],12))}</text>`;
  });
  const axisY = padT+plotH-((0-min)/range)*plotH;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;">
    <line x1="${padL}" y1="${axisY.toFixed(1)}" x2="${W-padR}" y2="${axisY.toFixed(1)}" stroke="#2C3345"/>
    ${bars}${labelsSvg}
  </svg>`;
}

function svgLine(labels, data, color){
  const W=560,H=230,padL=46,padB=40,padT=16,padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const max=Math.max(...data), min=Math.min(0,Math.min(...data));
  const range=(max-min)||1;
  const n=data.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const pts = data.map((v,i)=>[padL+i*stepX, padT+plotH-((v-min)/range)*plotH]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L ${pts[pts.length-1][0].toFixed(1)},${(padT+plotH).toFixed(1)} L ${pts[0][0].toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${color}"/>`).join('');
  const every = Math.max(1, Math.ceil(n/6));
  let xlabels='';
  labels.forEach((l,i)=>{
    if (i%every===0 || i===n-1) xlabels += `<text x="${pts[i][0].toFixed(1)}" y="${(H-padB+16).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">${esc(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;">
    <line x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}" stroke="#2C3345"/>
    <path d="${area}" fill="${color}" fill-opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2"/>
    ${dots}${xlabels}
  </svg>`;
}

function svgDoughnut(labels, data){
  const total = data.reduce((a,b)=>a+b,0) || 1;
  const cx=100, cy=100, r=80, rInner=48;
  let angle=-90, paths='';
  data.forEach((v,i)=>{
    const sweep = (v/total)*360;
    const large = sweep>180?1:0;
    const a1=angle*Math.PI/180, a2=(angle+sweep)*Math.PI/180;
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const ix1=cx+rInner*Math.cos(a2), iy1=cy+rInner*Math.sin(a2);
    const ix2=cx+rInner*Math.cos(a1), iy2=cy+rInner*Math.sin(a1);
    paths += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${rInner} ${rInner} 0 ${large} 0 ${ix2.toFixed(2)} ${iy2.toFixed(2)} Z" fill="${PALETTE[i%PALETTE.length]}"/>`;
    angle += sweep;
  });
  const legend = data.map((v,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-bottom:6px;">
      <span style="width:9px;height:9px;border-radius:2px;background:${PALETTE[i%PALETTE.length]};display:inline-block;flex-shrink:0;"></span>
      <span style="flex:1;">${esc(truncateLabel(labels[i],18))}</span>
      <span class="mono" style="color:var(--text);">${esc(fmtNum(v))}</span>
    </div>`).join('');
  return `<div style="display:flex; align-items:center; gap:22px; flex-wrap:wrap;">
    <svg viewBox="0 0 200 200" width="150" height="150" style="flex-shrink:0;">${paths}</svg>
    <div style="flex:1; min-width:140px;">${legend}</div>
  </div>`;
}

function svgScatter(points, xLabel, yLabel, color){
  const W=560,H=230,padL=48,padB=40,padT=14,padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const xr=(xmax-xmin)||1, yr=(ymax-ymin)||1;
  const dots = points.map(p=>{
    const x = padL + ((p.x-xmin)/xr)*plotW;
    const y = padT + plotH - ((p.y-ymin)/yr)*plotH;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${color}" fill-opacity="0.6"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;">
    <line x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}" stroke="#2C3345"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${(padT+plotH).toFixed(1)}" stroke="#2C3345"/>
    ${dots}
    <text x="${(W/2).toFixed(1)}" y="${H-2}" font-size="10" fill="#8B92A8" text-anchor="middle">${esc(xLabel)} →</text>
    <text x="${padL}" y="${(padT-4).toFixed(1)}" font-size="10" fill="#8B92A8" text-anchor="start">${esc(yLabel)} ↑</text>
  </svg>`;
}

function svgForecastLine(historyLabels, historyValues, forecastLabels, forecastValues){
  const W=620,H=250,padL=48,padB=42,padT=16,padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const allValues = [...historyValues, ...forecastValues];
  const allLabels = [...historyLabels, ...forecastLabels];
  const max=Math.max(...allValues), min=Math.min(0,Math.min(...allValues));
  const range=(max-min)||1;
  const n=allValues.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const pts = allValues.map((v,i)=>[padL+i*stepX, padT+plotH-((v-min)/range)*plotH]);
  const splitIdx = historyValues.length - 1;
  const solidPath = pts.slice(0,splitIdx+1).map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dashedPath = pts.slice(splitIdx).map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${i>splitIdx?'#E3A24B':'#5FB8B0'}"/>`).join('');
  const every = Math.max(1, Math.ceil(n/7));
  let xlabels='';
  allLabels.forEach((l,i)=>{
    if (i%every===0 || i===n-1) xlabels += `<text x="${pts[i][0].toFixed(1)}" y="${(H-padB+16).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">${esc(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;">
    <line x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}" stroke="#2C3345"/>
    <path d="${solidPath}" fill="none" stroke="#5FB8B0" stroke-width="2.2"/>
    <path d="${dashedPath}" fill="none" stroke="#E3A24B" stroke-width="2.2" stroke-dasharray="5,4"/>
    ${dots}${xlabels}
  </svg>`;
}

function renderChartBody(c){
  if (!c.type) return '';
  if (c.type === 'doughnut') return svgDoughnut(c.labels, c.data);
  if (c.type === 'scatter') return svgScatter(c.points, c.xLabel, c.yLabel, '#5FB8B0');
  if (c.type === 'line') return svgLine(c.labels, c.data, '#5FB8B0');
  return svgBar(c.labels, c.data, '#5FB8B0');
}


function reprocessRows(rows){

/* Shared parser: File -> { tables }. Used by normal CSV/Excel upload. */
function parseFileToTables(file){
  return new Promise((resolve, reject) => {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') {
      Papa.parse(file, {
        header: true, dynamicTyping: true, skipEmptyLines: true,
        complete: (res) => resolve({ [file.name]: res.data }),
        error: (err) => reject(err)
      });
    } else if (ext === 'xlsx' || ext === 'xls') {
      if (typeof XLSX === 'undefined') { reject(new Error('Excel support failed to load (network/CDN issue).')); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type:'array', cellDates:true });
          const tables = {};
          wb.SheetNames.forEach(name => {
            const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: null });
            if (json.length) tables[name] = json;
          });
          resolve(tables);
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('Failed to read the file from disk.'));
      reader.readAsArrayBuffer(file);
    } else {
      reject(new Error('Please upload a .csv or .xlsx file.'));
    }
  });
}

function handleFile(file){
  snapshotCurrent();
  parseFileToTables(file).then(tables => {
    const names = Object.keys(tables);
    if (!names.length || !tables[names[0]].length) { alert('No data rows found in file.'); return; }
    names.forEach(n => { tables[n] = tables[n].filter(r => Object.values(r).some(v => v !== null && v !== undefined && v !== '')); });
    state.fileName = file.name;
    state.fileSize = file.size;
    state.rawTables = tables;
    state.activeTableName = names[0];
    state.modelRows = tables[names[0]];
    state.querySteps = [];
    reprocessRows(state.modelRows);
    state.insights = null;
    state.recommendations = null;
    state.chatHistory = [];
    state.customDashboard = { visuals: null, kpis: null };
    state.dashboardUI = { editingId:null, menuOpenId:null, maximizedId:null, showFields:true, editingKpiId:null, kpiMenuOpenId:null, addFilterOpen:false, openFilterId:null };
    resetCustomFilters();
    pushToHistory();
    state.page = names.length > 1 ? 'datamodel' : 'overview';
    render();
  }).catch(err => alert(err.message || 'Could not read this file.'));
}

// Purely structural description — no industry/domain vocabulary. Describes the SHAPE of the data
// (what kind of thing each row is, and how many), never what business it might belong to.
function guessDomain(rows, columns){
  const entityCol = detectEntityColumn(rows, columns);
  if (entityCol) {
    const count = new Set(rows.map(r => r[entityCol.name]).filter(v => v!==null && v!==undefined && v!=='')).size;
    return `Dataset of ${count} ${entityLabelFromColumn(entityCol.name)}`;
  }
  return `Dataset with ${columns.length} columns, ${rows.length} rows`;
}

  for (let i=0;i<260;i++){
    const d = new Date(start.getTime() + i*86400000*2.2);
    const region = regions[Math.floor(Math.random()*regions.length)];
    const product = products[Math.floor(Math.random()*products.length)];
    const base = 400 + products.indexOf(product)*120;
    const seasonal = 1 + 0.25*Math.sin(i/30);
    const revenue = Math.round(base * seasonal * (0.7+Math.random()*0.8));
    const units = Math.max(1, Math.round(revenue/ (base/8)));
    rows.push({
      Date: d.toISOString().slice(0,10),
      Region: region,
      Product: product,
      Units_Sold: units,
      Revenue: revenue,
      Discount_Pct: Math.round(Math.random()*20),
    });
  }
  // inject an anomaly
  rows[133].Revenue = rows[133].Revenue * 6;
  const n = state.history.filter(h=>h.name && h.name.startsWith('demo_sales_data')).length;
  state.fileName = n ? `demo_sales_data_${n+1}.csv` : 'demo_sales_data.csv';
  state.fileSize = 12000;

  // a second small lookup table, to demonstrate Data Modeling (join Sales -> Products on Product)
  const productInfo = {
    'Aurora Desk':   { Category:'Furniture', Unit_Cost: 180, Supplier:'Meridian Co' },
    'Nimbus Chair':  { Category:'Furniture', Unit_Cost: 95,  Supplier:'Meridian Co' },
    'Trail Lamp':    { Category:'Lighting',  Unit_Cost: 40,  Supplier:'Northline Ltd' },
    'Comet Shelf':   { Category:'Storage',   Unit_Cost: 65,  Supplier:'Northline Ltd' },
    'Orbit Cabinet': { Category:'Storage',   Unit_Cost: 210, Supplier:'Meridian Co' },
  };
  const productTable = Object.entries(productInfo).map(([Product, v]) => ({ Product, ...v }));

  state.rawTables = { 'Sales': rows, 'Products': productTable };
  state.activeTableName = 'Sales';
  state.modelRows = rows;
  state.querySteps = [];
  reprocessRows(rows);
  state.insights = null; state.recommendations = null; state.chatHistory = []; state.forecastExplanation = null;
  state.customDashboard = { visuals: null, kpis: null };
  state.dashboardUI = { editingId:null, menuOpenId:null, maximizedId:null, showFields:true, editingKpiId:null, kpiMenuOpenId:null, addFilterOpen:false, openFilterId:null };
  resetCustomFilters();
  pushToHistory();
  state.page = 'overview';
  render();
}

function buildDataSummary(){
  const { columns } = state;
  const filterOn = filtersActive();
  const rows = getFilteredRows();
  const quality = filterOn ? profileData(rows).quality : state.quality;
  const kpis = filterOn ? buildKPIs(rows, columns) : state.kpis;
  const anomalies = filterOn ? detectAnomalies(rows, columns) : state.anomalies;
  const colSummary = columns.map(c => `- ${c.name} (${c.type}${c.semantic?', '+c.semantic:''}), ${c.uniqueCount} unique, ${c.missing} missing`).join('\n');
  const kpiSummary = kpis.map(k => `- ${k.label}: ${fmtNum(k.value)}${k.change!==null?` (change ${k.change.toFixed(1)}%)`:''}`).join('\n');
  const anomalySummary = (anomalies||[]).map(a => `- ${a.column} row ${a.row}: value ${fmtNum(a.value)}, ${a.direction} (z=${a.z})`).join('\n') || 'None detected.';
  const sampleRows = rows.slice(0,8).map(r => JSON.stringify(r)).join('\n');
  const filterNote = filterOn ? `\nACTIVE FILTERS (the figures below already reflect these): ${describeDateFilter(state.dateFilter)}${state.customFilters.length?' · '+state.customFilters.map(describeCustomFilter).join(' · '):''}\n` : '';
  return `Dataset: ${state.fileName}, ${rows.length}${filterOn?` of ${state.rows.length}`:''} rows, ${columns.length} columns. Likely domain: ${state.datasetLabel}.
${filterNote}
COLUMNS:
${colSummary}

QUALITY: score ${quality.score}/100. ${quality.issues.join(' ')}

DISCOVERED KPIs:
${kpiSummary || 'None computable.'}

ANOMALIES (statistical outliers, z-score > 3):
${anomalySummary}

SAMPLE ROWS (first 8):
${sampleRows}`;
}

/* ============================= CLAUDE AI ENGINE =============================
   Security note: a static HTML/JS file can never hold a real API key securely — anyone can read
   it from the page source or the Network tab. So this never asks for or stores a raw Anthropic key.
   Two ways Claude gets called, both real, neither fake:
   1. Default (no backend configured): calls the Claude.ai artifact proxy directly. This only
      succeeds when this file is running as an artifact inside claude.ai, where Anthropic injects
      the credential server-side — the browser never sees a key. Outside claude.ai this call will
      fail, and that failure is shown honestly (see callClaudeAPI below), never masked.
   2. Production (backend configured): the app POSTs to a URL you deploy yourself (see AI Engine
      Config page for ready-to-deploy proxy code). Your backend holds ANTHROPIC_API_KEY server-side
      and forwards the call to Claude — the key never reaches the browser.
*/
const CLAUDE_ARTIFACT_ENDPOINT = 'https://api.anthropic.com/v1/messages';

function aiEngineMode(){
  return state.aiConfig.backendUrl ? 'backend' : 'artifact';
}

async function callClaudeAPI(systemPrompt, userPrompt, opts){
  opts = opts || {};
  const maxRetries = opts.maxRetries ?? 2;
  const endpoint = state.aiConfig.backendUrl || CLAUDE_ARTIFACT_ENDPOINT;
  let lastErr = null;
  for (let attempt = 0; attempt <= maxRetries; attempt++){
    try {
      if (!state.aiConfig.backendUrl) {
        const sample = (window.claude && window.claude.use) ? await window.claude.use('sample') : null;
        if (!sample) throw new Error('Claude is not available in this view.');
        const out = await sample('INSTRUCTIONS:\n' + systemPrompt + '\n\nREQUEST:\n' + userPrompt);
        const t = (out && out.text || '').trim();
        if (!t) throw new Error('Claude returned an empty response.');
        state.aiConfig.lastError = null;
        return t;
      }
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: 'user', content: userPrompt }]
        })
      });
      if (!response.ok) {
        let bodyText = '';
        try { bodyText = (await response.text()).slice(0,200); } catch(_){}
        throw new Error(`Claude API returned ${response.status}${bodyText ? ': ' + bodyText : ''}`);
      }
      const data = await response.json();
      const text = (data.content || []).map(b => b.text || '').join('\n').trim();
      if (!text) throw new Error('Claude returned an empty response.');
      state.aiConfig.lastError = null;
      return text;
    } catch (err) {
      lastErr = err;
      if (attempt < maxRetries) await delay(500 * (attempt + 1)); // backoff before retry
    }
  }
  const modeHint = aiEngineMode() === 'artifact'
    ? 'Claude is unavailable. This works automatically inside claude.ai; if you\'re viewing this file standalone (downloaded/self-hosted), configure a backend proxy under AI Engine Config.'
    : 'Claude is unavailable via your configured backend endpoint. Check that it\'s deployed and reachable, then try again.';
  state.aiConfig.lastError = (lastErr ? lastErr.message : 'Unknown error') + ' — ' + modeHint;
  throw new Error(state.aiConfig.lastError);
}

async function testAIConnection(){
  state.aiConfig.testing = true; render();
  try {
    const text = await callClaudeAPI('Reply with exactly: OK', 'Reply with exactly: OK', { maxRetries: 0 });
    state.aiConfig.lastTestResult = { ok: true, message: 'Connected. Claude responded successfully.', at: new Date() };
  } catch (err) {
    state.aiConfig.lastTestResult = { ok: false, message: err.message, at: new Date() };
  }
  state.aiConfig.testing = false;
  render();
}

const ANALYST_SYSTEM = `You are BizAI Analyst, an AI business analyst embedded in a data dashboard app. You are given a structured profile of a dataset (columns, types, computed KPIs, detected statistical anomalies, and a small sample of rows) — never the full dataset. Rules:
1. Only use the data given to you. Never invent numbers, columns, or facts not present in the summary.
2. If something can't be answered from the given data, say so plainly and explain what additional data would help.
3. Clearly separate factual statements (directly computed from data) from interpretations/hypotheses (your reasoning about why something happened).
4. Be concise, concrete, and business-focused. Avoid generic filler.
5. Never assume a fixed business category (sales, HR, etc) beyond what the columns actually indicate.`;

async function generateInsights(){
  state.loadingInsights = true; render();
  const summary = buildDataSummary();
  const prompt = `${summary}

Based only on the above, produce:
1. A 2-3 sentence executive summary of what this dataset represents and the most important finding.
2. 3-5 key insights. For each, give: Finding (one line), Evidence (what in the data supports it, one line), Business Meaning (why it matters, one line), Suggested Action (one line), Priority (High/Medium/Low).
3. 3-5 recommendations. For each: Problem Identified, Evidence From Data, Recommended Action, Expected Business Impact, Priority (High/Medium/Low). Only include categories genuinely supported by this data.

Format as plain text with clear section headers "SUMMARY:", "INSIGHTS:", "RECOMMENDATIONS:" and each insight/recommendation as its own block starting with "---".`;
  try {
    const text = await callClaudeAPI(ANALYST_SYSTEM, prompt);
    state.insights = { raw: text, error: null };
  } catch(e) {
    state.insights = { raw: null, error: e.message };
  }
  state.loadingInsights = false;
  snapshotCurrent();
  render();
}

async function explainForecast(){
  const forecast = computeForecast(state.rows, state.columns, 3);
  if (!forecast) return;
  state.loadingForecastExplain = true; render();
  const prompt = `Forecast data (linear trend projection):
Metric: ${forecast.metricName}
Historical monthly values: ${forecast.historyLabels.map((l,i)=>`${l}=${fmtNum(forecast.historyValues[i])}`).join(', ')}
Projected next periods: ${forecast.forecastLabels.map((l,i)=>`${l}=${fmtNum(forecast.forecastValues[i])}`).join(', ')}
Trend fit (R²): ${(forecast.r2*100).toFixed(0)}%

In 3-4 sentences, explain in plain business language what this forecast means, how confident to be given the R² fit, and one thing worth watching. Base this ONLY on the numbers above — do not invent external causes (seasonality, promotions, etc.) unless the data itself shows them.`;
  try {
    const text = await callClaudeAPI(ANALYST_SYSTEM, prompt);
    state.forecastExplanation = { raw: text, error: null };
  } catch(e) {
    state.forecastExplanation = { raw: null, error: e.message };
  }
  state.loadingForecastExplain = false;
  snapshotCurrent();
  render();
}

async function sendChatMessage(msg){
  state.chatHistory.push({ role:'user', text: msg });
  state.loadingChat = true; render();
  const summary = buildDataSummary();
  const history = state.chatHistory.slice(-6).map(m => `${m.role==='user'?'User':'Assistant'}: ${m.text}`).join('\n');
  const prompt = `Dataset profile:\n${summary}\n\nConversation so far:\n${history}\n\nRespond to the user's latest message, grounded strictly in the dataset profile above. This may include financial or business questions (margins, growth, performance, risk) — answer them using only the numbers given.`;
  try {
    const text = await callClaudeAPI(ANALYST_SYSTEM, prompt);
    state.chatHistory.push({ role:'assistant', text, error:false });
  } catch(e) {
    state.chatHistory.push({ role:'assistant', text: e.message, error:true });
  }
  state.loadingChat = false;
  snapshotCurrent();
  render();
}

function dashDimensionColumns(){
  return state.columns.filter(c => c.type==='categorical' || c.type==='date' || c.type==='identifier');
}
function dashMeasureColumns(){
  return state.columns.filter(c => c.type==='numeric');
}
// SMART DEFAULTS for a newly created visual — chosen purely from the profiling system's detected
// column types/semantics (numeric, date, categorical, identifier, geography, percentage, currency,
// measure), never from hardcoded business column names, so this works for any dataset (Sales,
// Salary/Department, Marks/Course, Rent/City, or anything else the file contains).
function suggestNewVisualDefaults(){
  const dims = dashDimensionColumns();
  const measures = dashMeasureColumns();
  const categorical = dims.filter(d => d.type === 'categorical');
  // A "geography" categorical column (region/city/country/...) makes an especially natural default
  // breakdown; otherwise fall back to any categorical, then a date column, then an identifier.
  const geoDim = categorical.find(d => d.semantic === 'geography');
  const dateDim = dims.find(d => d.type === 'date');
  const identifierDim = dims.find(d => d.type === 'identifier');
  const xAxis = geoDim || categorical[0] || dateDim || identifierDim || null;
  // A percentage/rate column shouldn't be the default summed measure — prefer a plain measure or
  // currency column instead.
  const measure = measures.find(m => m.semantic !== 'percentage') || measures[0] || null;
  const chartType = (xAxis && xAxis.type === 'date') ? 'line' : 'bar';
  const title = (measure && xAxis) ? `${measure.name} by ${xAxis.name}`
              : xAxis ? `Record count by ${xAxis.name}`
              : 'New Visual';
  return {
    xAxis: xAxis ? xAxis.name : '',
    yAxis: measure ? measure.name : '',
    measures: measure ? [measure.name] : [],
    chartType,
    title,
  };
}
function newVisualId(){ return 'v_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
function makeVisual(overrides){
  return Object.assign({
    id: newVisualId(), title:'New Visual', chartType:'bar',
    xAxis:'', yAxis:'', legend:'', tooltip:'', aggregation:'sum',
    measures: [], stacking: 'grouped', // measures: extra selected measures for a multi-measure grouped/stacked chart
    topN: 'all', sortOrder: '', // topN: ranking filter by the selected measure; sortOrder: '' = smart default (chronological for dates, highest-first otherwise)
    layout: { w:1, h:1 }, // grid layout: w = column span (1 or 2 of 2), h = row span (1 normal, 2 tall)
    filters: [], // visual-level filters — apply on top of the global slicers, only to this one visual
  }, overrides);
}

function buildDefaultVisuals(){
  const dims = dashDimensionColumns();
  const measures = dashMeasureColumns();
  const catDims = dims.filter(d=>d.type==='categorical');
  const dateCol = dims.find(d=>d.type==='date');
  const visuals = [];
  if (dateCol && measures.length) {
    visuals.push(makeVisual({ title:`${measures[0].name} over time`, chartType:'line', xAxis:dateCol.name, yAxis:measures[0].name, measures:[measures[0].name], aggregation:'sum' }));
  }
  if (catDims.length && measures.length) {
    visuals.push(makeVisual({ title:`${measures[0].name} by ${catDims[0].name}`, chartType:'bar', xAxis:catDims[0].name, yAxis:measures[0].name, measures:[measures[0].name], aggregation:'sum' }));
  }
  if (catDims.length && measures.length > 1) {
    visuals.push(makeVisual({ title:`${measures[1].name} by ${catDims[0].name}`, chartType:'doughnut', xAxis:catDims[0].name, yAxis:measures[1].name, measures:[measures[1].name], aggregation:'sum' }));
  } else if (catDims.length > 1 && measures.length) {
    visuals.push(makeVisual({ title:`${measures[0].name} by ${catDims[1].name}`, chartType:'doughnut', xAxis:catDims[1].name, yAxis:measures[0].name, measures:[measures[0].name], aggregation:'sum' }));
  }
  if (measures.length >= 2) {
    visuals.push(makeVisual({ title:`${measures[0].name} vs ${measures[1].name}`, chartType:'scatter', xAxis:measures[0].name, yAxis:measures[1].name, aggregation:'sum' }));
  }
  if (!visuals.length && dims.length && measures.length) {
    visuals.push(makeVisual({ title:`${measures[0].name} by ${dims[0].name}`, chartType:'bar', xAxis:dims[0].name, yAxis:measures[0].name, measures:[measures[0].name], aggregation:'sum' }));
  }
  if (!measures.length && dims.length) {
    visuals.push(makeVisual({ title:`Record count by ${dims[0].name}`, chartType:'bar', xAxis:dims[0].name, yAxis:'', aggregation:'count' }));
  }
  return visuals;
}
/* ============================= SAVED DASHBOARD LAYOUTS (persist across reloads) =============
   Keyed off the dataset's column signature (names+types), so re-uploading the same shape of
   file — including after a full page refresh — restores the saved visuals/KPIs/slicers/layout
   automatically. Purely additive: if localStorage is unavailable (private mode, quota, etc.)
   every call below is a no-op and the in-memory dashboard behaves exactly as before. */
function dashboardStorageKey(){
  const sig = state.columns.map(c => c.name + ':' + c.type).sort().join('|');
  let hash = 0;
  for (let i = 0; i < sig.length; i++) { hash = ((hash << 5) - hash + sig.charCodeAt(i)) | 0; }
  return 'bizinsight_dashboard_' + hash;
}
function saveDashboardToStorage(){
  try {
    const payload = {
      visuals: state.customDashboard.visuals,
      kpis: state.customDashboard.kpis,
      customFilters: state.customFilters,
      dateFilter: state.dateFilter,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(dashboardStorageKey(), JSON.stringify(payload));
    return true;
  } catch (e) { return false; }
}
function loadDashboardFromStorage(){
  try {
    const raw = localStorage.getItem(dashboardStorageKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearSavedDashboard(){
  try { localStorage.removeItem(dashboardStorageKey()); } catch (e) {}
}
/* Exports the current Custom Dashboard as a PDF file via the browser's native print-to-PDF,
   the same mechanism the Report page's "Download as PDF" button uses — no external library
   needed. Hides the sidebar, toolbar buttons, fields panel, and card menus for a clean printout
   of just the KPIs and visuals, then restores the normal view. */
function downloadDashboardPDF(){
  document.body.classList.add('printing-dashboard');
  window.print();
  setTimeout(() => document.body.classList.remove('printing-dashboard'), 300);
}
function ensureCustomDashboard(){
  if (!state.customDashboard) state.customDashboard = {};
  if (!state.customDashboard.visuals || !state.customDashboard.kpis) {
    const saved = loadDashboardFromStorage();
    if (saved && saved.visuals && saved.visuals.length) {
      state.customDashboard.visuals = saved.visuals;
      state.customDashboard.kpis = saved.kpis && saved.kpis.length ? saved.kpis : buildDefaultCustomKpis();
      if (saved.customFilters) state.customFilters = saved.customFilters;
      if (saved.dateFilter) state.dateFilter = saved.dateFilter;
    } else {
      state.customDashboard.visuals = buildDefaultVisuals();
      state.customDashboard.kpis = buildDefaultCustomKpis();
    }
  }
  state.customDashboard.visuals.forEach(v => {
    if (!v.layout) v.layout = { w:1, h:1 };
    if (v.topN === undefined) v.topN = 'all';
    if (v.sortOrder === undefined) v.sortOrder = '';
    if (!v.filters) v.filters = [];
  });
  state.customDashboard.kpis.forEach(k => { if (!k.layout) k.layout = { w:1 }; });
}

function newKpiId(){ return 'k_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

  if (k.calc === 'distinct') return `Distinct ${col}`;

  if (k.calc === 'max') return `Max ${col}`;
  return col;
}
function kpiLabel(k){ return (k.title && k.title.trim()) ? k.title.trim() : kpiAutoLabel(k); }
function computeCustomKpiValue(k, rows){

function aggregateVals(vals, agg){
  if (agg === 'count') return vals.length;
  if (agg === 'distinct') return new Set(vals.map(v=>String(v))).size;
  const nums = vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if (!nums.length) return 0;
  if (agg === 'avg') return nums.reduce((a,b)=>a+b,0)/nums.length;
  if (agg === 'min') return Math.min(...nums);
  if (agg === 'max') return Math.max(...nums);
  return nums.reduce((a,b)=>a+b,0); // sum (default)
}
function xKeyForRow(row, colName){
  const col = state.columns.find(c=>c.name===colName);
  const v = row[colName];
  if (col && col.type === 'date') {
    const d = toDateSafe(v);
    return d ? d.toISOString().slice(0,7) : 'Unknown';
  }
  return (v===null||v===undefined||v==='') ? 'Unknown' : String(v);
}

/* Ranks `list` (objects with a `k` category key and a numeric field named `valueKey`) by that
   value to apply a Top-N / Bottom-N cut, then reorders the surviving items for display per
   `sortOrder`. `defaultCap` reproduces the old built-in crowding limits (20 items, or 24 for a
   date axis) but only when the user hasn't picked an explicit Top/Bottom N. */
function rankTrimSort(list, valueKey, topN, sortOrder, isDateX, defaultCap){
  let out = list;
  if (topN && topN !== 'all') {
    const ranked = [...list].sort((a,b)=>b[valueKey]-a[valueKey]);
    if (topN==='top5') out = ranked.slice(0,5);
    else if (topN==='top10') out = ranked.slice(0,10);
    else if (topN==='top20') out = ranked.slice(0,20);
    else if (topN==='bottom5') out = ranked.slice(-5).reverse();
    else if (topN==='bottom10') out = ranked.slice(-10).reverse();
  }
  if (sortOrder === 'asc') out = [...out].sort((a,b)=>a[valueKey]-b[valueKey]);
  else if (sortOrder === 'az') out = [...out].sort((a,b)=>String(a.k).localeCompare(String(b.k)));
  else if (sortOrder === 'za') out = [...out].sort((a,b)=>String(b.k).localeCompare(String(a.k)));
  else if (sortOrder === 'desc') out = [...out].sort((a,b)=>b[valueKey]-a[valueKey]);
  else { // '' = smart default
    if (isDateX) out = [...out].sort((a,b)=>String(a.k).localeCompare(String(b.k)));
    else out = [...out].sort((a,b)=>b[valueKey]-a[valueKey]);
  }
  if ((!topN || topN==='all') && defaultCap && out.length > defaultCap) {
    out = isDateX ? out.slice(-defaultCap) : out.slice(0, defaultCap);
  }
  return out;
}

function computeVisualData(v, rows){
  if (!v.xAxis) return null;
  if (v.filters && v.filters.length) rows = applyFiltersList(rows, v.filters);
  if (v.chartType === 'scatter') {
    const points = rows.map(r=>({ x:parseFloat(r[v.xAxis]), y:parseFloat(r[v.yAxis]) })).filter(p=>!isNaN(p.x)&&!isNaN(p.y));
    return { points: points.slice(0,600) };
  }
  const xGroups = {};
  rows.forEach(r=>{ const k = xKeyForRow(r, v.xAxis); (xGroups[k]=xGroups[k]||[]).push(r); });
  let xKeys = Object.keys(xGroups);
  const isDateX = state.columns.find(c=>c.name===v.xAxis && c.type==='date');
  if (isDateX) xKeys.sort();

  // Multiple measures selected (e.g. X-Axis: Region, Measures: Sales + Profit) -> one series per
  // measure, grouped or stacked side-by-side. This takes priority over a Legend breakdown, since a
  // chart can only sensibly split by one thing at a time.
  const multiMeasures = (v.measures && v.measures.length > 1) ? v.measures : null;
  const primaryMeasure = multiMeasures ? multiMeasures[0] : (v.yAxis || (v.measures && v.measures[0]) || '');

  const valueForMeasure = (subset, measureName) => v.aggregation==='count' ? subset.length : aggregateVals(subset.map(r=>r[measureName]), v.aggregation||'sum');
  const valueFor = (subset) => valueForMeasure(subset, primaryMeasure);
  const tooltipFor = (subset) => {
    if (!v.tooltip) return '';
    const vals = Array.from(new Set(subset.map(r=>r[v.tooltip]).filter(x=>x!==null&&x!==undefined&&x!=='').map(String)));
    return truncateLabel(vals.slice(0,3).join(', '), 40);
  };

  if (multiMeasures) {
    let totalsByX = xKeys.map(k => ({k, v: multiMeasures.reduce((a,m)=>a+valueForMeasure(xGroups[k], m),0)}));
    totalsByX = rankTrimSort(totalsByX, 'v', v.topN, v.sortOrder, isDateX, isDateX ? 24 : 20);
    xKeys = totalsByX.map(t=>t.k);
    const series = multiMeasures.map((m,i) => ({
      name: m, color: PALETTE[i % PALETTE.length],
      data: xKeys.map(k => valueForMeasure(xGroups[k], m)),
    }));
    const tooltips = xKeys.map(k=>tooltipFor(xGroups[k]));
    return { labels: xKeys, series, tooltips, tooltipName: v.tooltip, stacked: v.stacking==='stacked' };
  }

  if (v.legend) {
    let legendVals = Array.from(new Set(rows.map(r => String(r[v.legend] ?? 'Unknown'))));
    if (legendVals.length > 6) {
      const totals = legendVals.map(lv => ({lv, t: aggregateVals(rows.filter(r=>String(r[v.legend]??'Unknown')===lv).map(r=>r[primaryMeasure]), v.aggregation||'sum')}));
      totals.sort((a,b)=>b.t-a.t);
      legendVals = totals.slice(0,6).map(t=>t.lv);
    }
    let totalsByX = xKeys.map(k => ({k, v: valueFor(xGroups[k])}));
    totalsByX = rankTrimSort(totalsByX, 'v', v.topN, v.sortOrder, isDateX, isDateX ? 24 : 20);
    xKeys = totalsByX.map(t=>t.k);
    const series = legendVals.map((lv,i) => ({
      name: lv, color: PALETTE[i % PALETTE.length],
      data: xKeys.map(k => valueFor(xGroups[k].filter(r=>String(r[v.legend]??'Unknown')===lv))),
    }));
    const tooltips = xKeys.map(k=>tooltipFor(xGroups[k]));
    return { labels: xKeys, series, tooltips, tooltipName: v.tooltip, stacked: v.stacking==='stacked' };
  }

  let entries = xKeys.map(k => ({k, v: valueFor(xGroups[k]), t: tooltipFor(xGroups[k])}));
  const topNSet = v.topN && v.topN !== 'all';
  const isPieLike = ['pie','doughnut'].includes(v.chartType);
  entries = rankTrimSort(entries, 'v', v.topN, v.sortOrder, isDateX, (topNSet || isPieLike) ? null : 20);
  if (!topNSet && isPieLike && entries.length > 8) {
    const top = entries.slice(0,7);
    const rest = entries.slice(7).reduce((a,e)=>a+e.v,0);
    entries = [...top, {k:'Other', v:rest, t:''}];
  }
  return {
    labels: entries.map(e=>e.k),
    series: [{ name: primaryMeasure || 'Count', color: PALETTE[0], data: entries.map(e=>e.v) }],
    tooltips: entries.map(e=>e.t), tooltipName: v.tooltip,
  };
}

function svgBarGrouped(labels, series, horizontal, tooltips, stacked, xfilter){
  const W=560,H=240;
  const padL = horizontal? 96:44, padB = horizontal?26:58, padT=14, padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=labels.length, sCount=series.length || 1;
  stacked = !!stacked && sCount > 1;
  let max, min;
  if (stacked) {
    const pos = labels.map((_,i)=> series.reduce((a,s)=> a + Math.max(s.data[i]||0,0), 0));
    const neg = labels.map((_,i)=> series.reduce((a,s)=> a + Math.min(s.data[i]||0,0), 0));
    max = Math.max(...pos,0); min = Math.min(...neg,0);
  } else {
    const allVals = series.flatMap(s=>s.data);
    max=Math.max(...allVals,0); min=Math.min(0,Math.min(...allVals));
  }
  const range=(max-min)||1;
  let body='';
  const titleFor = i => (tooltips && tooltips[i]) ? `<title>${esc(String(labels[i]))}: ${esc(tooltips[i])}</title>` : '';
  const xfCol = xfilter && xfilter.column, xfSel = xfilter && xfilter.selectedValue;
  const gOpen = i => {
    if (!xfCol) return '<g>';
    const isSel = xfSel && String(labels[i])===xfSel;
    const cls = (xfSel && !isSel) ? 'xfilter-seg' : 'xfilter-seg';
    const op = (xfSel && !isSel) ? '0.38' : '1';
    return `<g class="${cls}" style="cursor:pointer; opacity:${op};" data-xfilter-col="${esc(xfCol)}" data-xfilter-val="${esc(String(labels[i]))}">`;
  };
  const gClose = '</g>';
  if (!horizontal){
    const groupW = plotW/(n||1);
    const barW = stacked ? Math.min(groupW*0.6, 46) : Math.min((groupW*0.72)/sCount, 40);
    labels.forEach((lab,i)=>{
      let seg='';
      if (stacked) {
        const gx = padL + i*groupW + (groupW - barW)/2;
        let posCum=0, negCum=0;
        series.forEach(s=>{
          const val = s.data[i]||0;
          const from = val>=0 ? posCum : negCum;
          const to = val>=0 ? (posCum+=val) : (negCum+=val);
          const y1 = padT+plotH-((from-min)/range)*plotH, y2 = padT+plotH-((to-min)/range)*plotH;
          const y=Math.min(y1,y2), h=Math.max(Math.abs(y1-y2),1);
          seg += `<rect x="${gx.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${s.color}" fill-opacity="0.88">${titleFor(i)}</rect>`;
        });
        const cx = gx + barW/2;
        seg += `<text x="${cx.toFixed(1)}" y="${(H-padB+16).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="end" font-family="IBM Plex Sans, sans-serif" transform="rotate(-30 ${cx.toFixed(1)} ${(H-padB+16).toFixed(1)})">${esc(truncateLabel(String(lab),12))}</text>`;
        body += gOpen(i) + seg + gClose; return;
      }
      const gx = padL + i*groupW + (groupW - barW*sCount)/2;
      series.forEach((s,si)=>{
        const val = s.data[i]||0;
        const zeroY = padT+plotH-((0-min)/range)*plotH;
        const valY = padT+plotH-((val-min)/range)*plotH;
        const y=Math.min(zeroY,valY), h=Math.max(Math.abs(zeroY-valY),1);
        const x = gx+si*barW;
        seg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(barW-2,1).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}" fill-opacity="0.88">${titleFor(i)}</rect>`;
      });
      const cx = gx + (barW*sCount)/2;
      seg += `<text x="${cx.toFixed(1)}" y="${(H-padB+16).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="end" font-family="IBM Plex Sans, sans-serif" transform="rotate(-30 ${cx.toFixed(1)} ${(H-padB+16).toFixed(1)})">${esc(truncateLabel(String(lab),12))}</text>`;
      body += gOpen(i) + seg + gClose;
    });
    const axisY = padT+plotH-((0-min)/range)*plotH;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;"><line x1="${padL}" y1="${axisY.toFixed(1)}" x2="${W-padR}" y2="${axisY.toFixed(1)}" stroke="#2C3345"/>${body}</svg>` + legendRow(series);
  }
  const groupH = plotH/(n||1);
  const barH = stacked ? Math.min(groupH*0.6, 30) : Math.min((groupH*0.72)/sCount, 22);
  const maxAbs = stacked ? (Math.max(Math.abs(max),Math.abs(min))||1) : (Math.max(Math.abs(max),Math.abs(min))||1);
  labels.forEach((lab,i)=>{
    let seg='';
    if (stacked) {
      const gy = padT + i*groupH + (groupH-barH)/2;
      let posCum=0, negCum=0;
      series.forEach(s=>{
        const val = s.data[i]||0;
        const from = val>=0 ? posCum : negCum;
        const to = val>=0 ? (posCum+=val) : (negCum+=val);
        const x1 = padL + (from/maxAbs)*plotW*0.94, x2 = padL + (to/maxAbs)*plotW*0.94;
        const x=Math.min(x1,x2), w=Math.max(Math.abs(x2-x1),1);
        seg += `<rect x="${x.toFixed(1)}" y="${gy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(barH-2,1).toFixed(1)}" rx="2" fill="${s.color}" fill-opacity="0.88">${titleFor(i)}</rect>`;
      });
      const cy = gy + barH/2;
      seg += `<text x="${(padL-6).toFixed(1)}" y="${(cy+3).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="end" font-family="IBM Plex Sans, sans-serif">${esc(truncateLabel(String(lab),15))}</text>`;
      body += gOpen(i) + seg + gClose; return;
    }
    const gy = padT + i*groupH + (groupH-barH*sCount)/2;
    series.forEach((s,si)=>{
      const val = s.data[i]||0;
      const w = (Math.abs(val)/maxAbs)*plotW*0.94;
      const y = gy+si*barH;
      seg += `<rect x="${padL}" y="${y.toFixed(1)}" width="${Math.max(w,1).toFixed(1)}" height="${Math.max(barH-2,1).toFixed(1)}" rx="2" fill="${s.color}" fill-opacity="0.88">${titleFor(i)}</rect>`;
    });
    const cy = gy + (barH*sCount)/2;
    seg += `<text x="${(padL-6).toFixed(1)}" y="${(cy+3).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="end" font-family="IBM Plex Sans, sans-serif">${esc(truncateLabel(String(lab),15))}</text>`;
    body += gOpen(i) + seg + gClose;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${(padT+plotH).toFixed(1)}" stroke="#2C3345"/>${body}</svg>` + legendRow(series);
}

function svgLineMulti(labels, series, filled, tooltips, xfilter){
  const W=560,H=240,padL=46,padB=40,padT=16,padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const allVals = series.flatMap(s=>s.data);
  const max=Math.max(...allVals,0), min=Math.min(0,Math.min(...allVals));
  const range=(max-min)||1;
  const n=labels.length;
  const stepX = n>1?plotW/(n-1):0;
  const titleFor = i => (tooltips && tooltips[i]) ? `<title>${esc(String(labels[i]))}: ${esc(tooltips[i])}</title>` : '';
  const xfCol = xfilter && xfilter.column, xfSel = xfilter && xfilter.selectedValue;
  let paths='';
  series.forEach(s=>{
    const pts = s.data.map((val,i)=>[padL+i*stepX, padT+plotH-((val-min)/range)*plotH]);
    const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    if (filled && pts.length) {
      const area = path + ` L ${pts[pts.length-1][0].toFixed(1)},${(padT+plotH).toFixed(1)} L ${pts[0][0].toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
      paths += `<path d="${area}" fill="${s.color}" fill-opacity="0.14" stroke="none"/>`;
    }
    paths += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`;
    paths += pts.map((p,i)=>{
      const isSel = xfSel && String(labels[i])===xfSel;
      const op = (xfSel && !isSel) ? '0.35' : '1';
      const clickAttrs = xfCol ? ` data-xfilter-col="${esc(xfCol)}" data-xfilter-val="${esc(String(labels[i]))}" style="cursor:pointer;"` : '';
      const rr = isSel ? 4.4 : 2.6;
      return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rr}" fill="${s.color}" fill-opacity="${op}" class="xfilter-seg"${clickAttrs}>${titleFor(i)}</circle>`;
    }).join('');
  });
  const every = Math.max(1, Math.ceil(n/6));
  let xlabels='';
  labels.forEach((l,i)=>{
    if (i%every===0 || i===n-1) xlabels += `<text x="${(padL+i*stepX).toFixed(1)}" y="${(H-padB+16).toFixed(1)}" font-size="9.5" fill="#8B92A8" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">${esc(truncateLabel(String(l),10))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible; display:block;"><line x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}" stroke="#2C3345"/>${paths}${xlabels}</svg>` + legendRow(series);
}

function svgPieOrDonut(labels, data, donut, xfilter){
  const total = data.reduce((a,b)=>a+b,0) || 1;
  const cx=100, cy=100, r=80, rInner = donut?48:0;
  const xfCol = xfilter && xfilter.column, xfSel = xfilter && xfilter.selectedValue;
  let angle=-90, paths='';
  data.forEach((v,i)=>{
    const sweep=(v/total)*360;
    const large=sweep>180?1:0;
    const a1=angle*Math.PI/180, a2=(angle+sweep)*Math.PI/180;
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const isSel = xfSel && String(labels[i])===xfSel;
    const op = (xfSel && !isSel) ? '0.35' : '1';
    const clickAttrs = xfCol ? ` data-xfilter-col="${esc(xfCol)}" data-xfilter-val="${esc(String(labels[i]))}" style="cursor:pointer;"` : '';
    if (rInner>0){
      const ix1=cx+rInner*Math.cos(a2), iy1=cy+rInner*Math.sin(a2);
      const ix2=cx+rInner*Math.cos(a1), iy2=cy+rInner*Math.sin(a1);
      paths += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${rInner} ${rInner} 0 ${large} 0 ${ix2.toFixed(2)} ${iy2.toFixed(2)} Z" fill="${PALETTE[i%PALETTE.length]}" fill-opacity="${op}" class="xfilter-seg"${clickAttrs}/>`;
    } else {
      paths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${PALETTE[i%PALETTE.length]}" fill-opacity="${op}" class="xfilter-seg"${clickAttrs}/>`;
    }
    angle += sweep;
  });
  const legend = data.map((v,i)=>{
    const isSel = xfSel && String(labels[i])===xfSel;
    const clickAttrs = xfCol ? ` data-xfilter-col="${esc(xfCol)}" data-xfilter-val="${esc(String(labels[i]))}" style="cursor:pointer;"` : '';
    return `<div class="xfilter-seg" style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-bottom:6px; opacity:${(xfSel && !isSel)?'0.5':'1'};"${clickAttrs}>
      <span style="width:9px;height:9px;border-radius:2px;background:${PALETTE[i%PALETTE.length]};display:inline-block;flex-shrink:0;"></span>
      <span style="flex:1;">${esc(truncateLabel(String(labels[i]),18))}</span>
      <span class="mono" style="color:var(--text);">${esc(fmtNum(v))}</span>
    </div>`;
  }).join('');
  return `<div style="display:flex; align-items:center; gap:22px; flex-wrap:wrap;">
    <svg viewBox="0 0 200 200" width="150" height="150" style="flex-shrink:0;">${paths}</svg>
    <div style="flex:1; min-width:140px;">${legend}</div>
  </div>`;
}

function legendRow(series){
  if (series.length<=1) return '';
  return `<div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">${series.map(s=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);"><span style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block;"></span>${esc(truncateLabel(s.name,16))}</div>`).join('')}</div>`;
}

function tableChartHtml(labels, series, xName, tooltips, tooltipName, xfilter){
  const showTip = tooltipName && tooltips;
  const xfCol = xfilter && xfilter.column, xfSel = xfilter && xfilter.selectedValue;
  const rowsHtml = labels.map((l,i)=>{
    const isSel = xfSel && String(l)===xfSel;
    const attrs = xfCol ? ` class="xfilter-seg" data-xfilter-col="${esc(xfCol)}" data-xfilter-val="${esc(String(l))}" style="cursor:pointer; ${isSel?'background:var(--surface2);':''} opacity:${(xfSel && !isSel)?'0.5':'1'};"` : '';
    return `<tr${attrs}><td>${esc(String(l))}</td>${series.map(s=>`<td>${fmtNum(s.data[i])}</td>`).join('')}${showTip?`<td>${esc(tooltips[i]||'')}</td>`:''}</tr>`;
  }).join('');
  return `<div class="table-wrap" style="max-height:280px;"><table>
    <thead><tr><th>${esc(xName||'Category')}</th>${series.map(s=>`<th>${esc(s.name)}</th>`).join('')}${showTip?`<th>${esc(tooltipName)}</th>`:''}</tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;
}

function renderVisualBody(v, data){
  if (!data) return `<div class="empty" style="padding:24px;"><p>Choose an X-Axis and Y-Axis to build this visual.</p></div>`;
  if (v.chartType === 'scatter') {
    if (!data.points.length) return `<div class="empty" style="padding:24px;"><p>No numeric pairs available for this selection.</p></div>`;
    return svgScatter(data.points, v.xAxis, v.yAxis, '#5FB8B0');
  }
  const { labels, series, tooltips, tooltipName } = data;
  if (!labels.length) return `<div class="empty" style="padding:24px;"><p>No data for the current selection.</p></div>`;
  // Only offer click-to-cross-filter on a single-measure, non-legend-split categorical axis —
  // that's the case where a bar/slice maps 1:1 to one column value, matching Power BI's model.
  const xfilterable = !v.legend && (!v.measures || v.measures.length <= 1);
  const xfilter = xfilterable ? {
    column: v.xAxis,
    selectedValue: (state.crossFilter && state.crossFilter.column === v.xAxis) ? state.crossFilter.value : null,
  } : null;
  if (v.chartType === 'table') return tableChartHtml(labels, series, v.xAxis, tooltips, tooltipName, xfilter);
  if (v.chartType === 'pie') return svgPieOrDonut(labels, series[0].data, false, xfilter);
  if (v.chartType === 'doughnut') return svgPieOrDonut(labels, series[0].data, true, xfilter);
  if (v.chartType === 'line') return svgLineMulti(labels, series, false, tooltips, xfilter);
  if (v.chartType === 'area') return svgLineMulti(labels, series, true, tooltips, xfilter);
  if (v.chartType === 'hbar') return svgBarGrouped(labels, series, true, tooltips, data.stacked, xfilter);
  return svgBarGrouped(labels, series, false, tooltips, data.stacked, xfilter); // bar (default)
}

function chartTypeSubLabel(v){
  const aggLbl = (AGG_OPTIONS.find(a=>a.id===v.aggregation)||{}).label || 'Sum';
  const typeLbl = (CHART_TYPE_OPTIONS.find(t=>t.id===v.chartType)||{}).label || 'Bar';
  const topNLbl = (TOPN_OPTIONS.find(t=>t.id===v.topN)||{}).label;
  const topNSuffix = (topNLbl && topNLbl!=='All') ? ` · ${esc(topNLbl)}` : '';
  const sortLbl = (SORT_OPTIONS.find(s=>s.id===v.sortOrder)||{}).label;
  const sortSuffix = (v.sortOrder) ? ` · Sort: ${esc(sortLbl)}` : '';
  if (v.chartType==='scatter') return `Scatter · ${esc(v.xAxis||'—')} vs ${esc(v.yAxis||'—')}`;
  const measureLabel = (v.measures && v.measures.length > 1) ? `${v.measures.join(', ')} (${v.stacking==='stacked'?'Stacked':'Grouped'})` : (v.yAxis || (v.measures&&v.measures[0]) || 'records');
  return `${typeLbl} · ${aggLbl} of ${esc(measureLabel)} by ${esc(v.xAxis||'—')}${v.legend && !(v.measures&&v.measures.length>1)?` · Legend: ${esc(v.legend)}`:''}${topNSuffix}${sortSuffix}`;
}

function applyFieldToSlot(slot, field, kind){
  const v = state.customDashboard.visuals.find(x=>x.id===state.dashboardUI.editingId);
  if (!v || !field) return;
  if (slot === 'yAxis' && kind !== 'measure') return; // Y-Axis only accepts numeric measures
  if (slot === 'xAxis' && v.chartType === 'scatter' && kind !== 'measure') return; // scatter needs numeric X too
  v[slot] = field;
  render();
}

function handleVisualMenuAction(action, id){
  const list = state.customDashboard.visuals;
  const idx = list.findIndex(x=>x.id===id);
  if (idx === -1) return;
  state.dashboardUI.menuOpenId = null;
  if (action === 'edit') { state.dashboardUI.editingId = id; render(); return; }
  if (action === 'duplicate') {
    const copy = Object.assign({}, list[idx], { id:newVisualId(), title: list[idx].title + ' (Copy)' });
    list.splice(idx+1, 0, copy);
    render(); return;
  }
  if (action === 'rename') {
    const name = prompt('Rename visual', list[idx].title);
    if (name && name.trim()) list[idx].title = name.trim();
    render(); return;
  }
  if (action === 'maximize') { state.dashboardUI.maximizedId = id; render(); return; }
  if (action === 'delete') {
    if (!confirm('Delete this visual?')) return;
    list.splice(idx,1);
    render(); return;
  }
  if (action === 'export') { exportVisualPNG(id); return; }
}

function exportVisualPNG(id){
  const host = document.querySelector(`[data-visual-body="${id}"]`);
  const svg = host ? host.querySelector('svg') : null;
  if (!svg) { alert("This visual type can't be exported as PNG (tables and multi-part charts aren't supported yet) — try a bar, line, area or scatter visual instead."); return; }
  const v = state.customDashboard.visuals.find(x=>x.id===id);
  let svgStr = new XMLSerializer().serializeToString(svg);
  if (!/xmlns=/.test(svgStr)) svgStr = svgStr.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  const vb = (svg.getAttribute('viewBox')||'0 0 560 240').split(' ').map(Number);
  const w = vb[2]||560, h = vb[3]||240;
  const url = URL.createObjectURL(new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1A1F2B'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (v ? v.title.replace(/[^a-z0-9]+/gi,'_') : 'visual') + '.png';
      a.click();
    });
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Could not export this visual as PNG.'); };
  img.src = url;
}

  document.getElementById('reset-dashboard-btn')?.addEventListener('click', ()=>{

      state.crossFilter = null; // clicking the same segment again toggles the selection off
    } else {
      state.crossFilter = { column, value };

  }));

  /* --- Drag to reorder visuals / KPIs (also moves a visual between rows) --- */
  bindGridDragReorder(main, '.chart-grid', '[data-visual-card]', 'data-visual-card', '[data-drag-visual]', state.customDashboard.visuals);
  bindGridDragReorder(main, '.kpi-grid', '[data-kpi-card]', 'data-kpi-card', '[data-drag-kpi]', state.customDashboard.kpis);

  /* --- Drag to resize a visual card (toggles half-width/full-width and normal/tall) --- */
  main.querySelectorAll('[data-resize-visual]').forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const id = handle.getAttribute('data-resize-visual');
      const v = state.customDashboard.visuals.find(x=>x.id===id);
      const card = handle.closest('[data-visual-card]');
      if (!v || !card) return;
      const startX = e.clientX, startY = e.clientY;
      const rect = card.getBoundingClientRect();
      const startW = rect.width, startH = rect.height;
      const onMove = (ev)=>{
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        const w = (dx / startW) > 0.22 ? 2 : ((dx / startW) < -0.22 ? 1 : v.layout.w);
        const h = (dy / startH) > 0.28 ? 2 : ((dy / startH) < -0.28 ? 1 : v.layout.h);
        card.style.outline = '2px dashed var(--teal)';
        card.dataset.pendingW = w; card.dataset.pendingH = h;
      };
      const onUp = ()=>{
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        card.style.outline = '';
        const w = Number(card.dataset.pendingW||v.layout.w), h = Number(card.dataset.pendingH||v.layout.h);
        v.layout.w = w; v.layout.h = h;
        render();
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

/* Generic drag-to-reorder for a grid of cards. Reorders `list` in place (same array reference
   the app already persists via state.customDashboard/state.history), so no separate storage
   is needed — the existing history/state system picks the new order up automatically. */
function bindGridDragReorder(main, containerSel, cardSel, cardAttr, handleSel, list){
  const container = main.querySelector(containerSel);
  if (!container || !list) return;
  let draggedId = null;
  container.querySelectorAll(handleSel).forEach(handle=>{
    handle.addEventListener('dragstart', (e)=>{
      const card = handle.closest(cardSel);
      draggedId = card ? card.getAttribute(cardAttr) : null;
      if (card) card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId || '');
    });
    handle.addEventListener('dragend', ()=>{
      container.querySelectorAll(cardSel).forEach(c=>c.classList.remove('dragging','drag-over'));
      draggedId = null;
    });
  });
  container.querySelectorAll(cardSel).forEach(card=>{
    card.addEventListener('dragover', (e)=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', ()=> card.classList.remove('drag-over'));
    card.addEventListener('drop', (e)=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = card.getAttribute(cardAttr);
      if (!draggedId || draggedId === targetId) return;
      const fromIdx = list.findIndex(x=>x.id===draggedId);
      const toIdx = list.findIndex(x=>x.id===targetId);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, moved);
      render();
    });
  });
}

          </div>
          <div class="value">${fmtNum(k.value)}</div>
          ${k.change !== null ? `<div class="change ${k.change>0.5?'up':k.change<-0.5?'down':'flat'}">${k.change>0?'▲':k.change<0?'▼':'—'} ${Math.abs(k.change).toFixed(1)}% vs first half of period</div>` : `<div class="change flat">avg ${fmtNum(k.avgValue)}</div>`}
          ${targetBlock}
        </div>`;
      }).join('')}
    </div>` : `<div class="empty"><p>No numeric KPIs could be computed from this dataset.</p></div>`}

    ${charts.length ? `<div class="section-title">Charts</div>
    <div class="grid chart-grid">
      ${charts.map((c) => `
        <div class="card chart-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div style="min-width:0; flex:1;">
              <h3 style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(c.title)}">${esc(c.title)}</h3>
              <div class="sub">${esc(c.sub)}</div>
            </div>
            ${c.key ? `<span class="btn ghost" style="padding:4px 9px; font-size:11px; flex-shrink:0;" data-rename-chart="${esc(c.key)}" data-rename-chart-current="${esc(c.title)}" title="Rename this visual">✎ Rename</span>` : ''}
          </div>
          ${renderChartBody(c)}
        </div>`).join('')}
    </div>` : `<div class="empty"><p>Not enough structured data in this file to build charts yet.</p></div>`}

    ${topN ? `<div class="section-title">Top 10 by ${esc(topN.dimension)}</div>
    <div class="card" style="padding:0;">
      <div class="table-wrap" style="margin-top:0;">
        <table>
          <thead><tr><th>#</th><th>${esc(topN.dimension)}</th><th>${esc(topN.metricName)}</th><th>Share</th></tr></thead>
          <tbody>
            ${topN.rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${fmtNum(r.value)}</td><td>${r.share.toFixed(1)}%</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}

    ${anomalies && anomalies.length ? `
    <div class="section-title">Anomalies Detected</div>
    <div class="card">
      ${anomalies.map(a => `
        <div class="insight">
          <div class="insight-head"><span class="fact-tag fact">Fact</span><h4 style="font-size:13px;">${esc(a.column)} — ${a.direction}</h4></div>
          <p>Row ${a.row}: value ${fmtNum(a.value)}, ${Math.abs(a.z)}σ from the mean.</p>
        </div>`).join('')}
    </div>` : ''}
  `;
  main.querySelectorAll('[data-set-target]').forEach(el => {
    el.addEventListener('click', () => {
      const label = el.getAttribute('data-set-target');
      const current = state.kpiTargets[label];
      const val = prompt(`Set target for "${label}":`, current || '');
      if (val === null) return;
      const num = parseFloat(val);
      if (val.trim() === '') { delete state.kpiTargets[label]; }
      else if (!isNaN(num)) { state.kpiTargets[label] = num; }
      render();
    });
  });
  document.getElementById('customize-dash-btn')?.addEventListener('click', () => { state.page = 'customdash'; render(); });
  main.querySelectorAll('[data-rename-chart]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-rename-chart');
      const current = el.getAttribute('data-rename-chart-current') || '';
      const name = prompt('Rename visual', current);
      if (name === null) return; // cancelled
      const trimmed = name.trim();
      if (trimmed === '') { delete state.chartTitleOverrides[key]; } // empty = revert to auto title
      else { state.chartTitleOverrides[key] = trimmed; }
      render();
    });
  });
  bindDateFilterBar(main);
}

function renderExplorer(main){
  const { columns } = state;
  const filterBarHtml = renderDateFilterBar();
  const rows = getFilteredRows();
  const filterActive = filtersActive();
  const categorical = columns.filter(c => c.type === 'categorical');
  const catCol = categorical[0];
  let valOptions = [];
  if (catCol) {
    const counts = {};
    rows.forEach(r => { const k = String(r[catCol.name] ?? 'Unknown'); counts[k] = (counts[k]||0)+1; });
    valOptions = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  }
  main.innerHTML = `
    <div class="pagehead"><h1>Data Explorer</h1><p>${rows.length}${filterActive ? ` of ${state.rows.length}` : ''} rows · ${columns.length} columns · ${esc(state.fileName)}</p></div>

    ${filterBarHtml}

    <div class="card" style="margin-bottom:16px;">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Column</th><th>Type</th><th>Semantic</th><th>Unique</th><th>Missing</th></tr></thead>
          <tbody>
            ${columns.map(c => `<tr><td class="mono">${esc(c.name)}</td><td>${esc(c.type)}</td><td>${esc(c.semantic||'—')}</td><td>${c.uniqueCount}</td><td>${c.missing}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    ${filterActive && !rows.length ? `<div class="card empty"><p>No records match the selected filters.</p></div>` : `

    ${catCol && valOptions.length >= 2 ? `
    <div class="section-title" style="margin-top:0;">Compare Segments</div>
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;">
        <div>
          <label style="font-size:11.5px;color:var(--muted); display:block; margin-bottom:5px;">Compare by ${esc(catCol.name)}</label>
          <select id="cmp-a">${valOptions.map((v,i)=>`<option ${i===0?'selected':''}>${esc(v)}</option>`).join('')}</select>
        </div>
        <div style="color:var(--muted); padding-bottom:8px;">vs</div>
        <div>
          <select id="cmp-b">${valOptions.map((v,i)=>`<option ${i===1?'selected':''}>${esc(v)}</option>`).join('')}</select>
        </div>
        <button class="btn ghost" id="cmp-run-btn">Compare</button>
      </div>
      <div id="cmp-result"></div>
    </div>` : ''}

    <div class="section-title">Data Preview (first 50 rows)</div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>${columns.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.slice(0,50).map(r => `<tr>${columns.map(c=>`<td>${esc(r[c.name])}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    `}
  `;
  const runCompare = () => {
    const valA = document.getElementById('cmp-a').value;
    const valB = document.getElementById('cmp-b').value;
    const result = compareSegments(rows, columns, catCol.name, valA, valB);
    const box = document.getElementById('cmp-result');
    if (!result.metrics.length) { box.innerHTML = `<p style="color:var(--muted); font-size:12.5px;">No numeric columns to compare.</p>`; return; }
    box.innerHTML = `
      <table>
        <thead><tr><th>Metric</th><th>${esc(valA)} (n=${result.countA})</th><th>${esc(valB)} (n=${result.countB})</th><th>Difference</th></tr></thead>
        <tbody>
          ${result.metrics.map(m => `<tr>
            <td>${esc(m.name)}</td><td>${fmtNum(m.a)}</td><td>${fmtNum(m.b)}</td>
            <td class="${m.pctDiff>0.5?'up':m.pctDiff<-0.5?'down':'flat'}">${m.pctDiff!==null?(m.pctDiff>0?'▲':'▼')+' '+Math.abs(m.pctDiff).toFixed(1)+'%':'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  };
  document.getElementById('cmp-run-btn')?.addEventListener('click', runCompare);
  if (catCol && valOptions.length >= 2) runCompare();
  bindDateFilterBar(main);
}

function renderInsights(main, isReco){
  main.innerHTML = `
    <div class="pagehead">
      <h1>${isReco ? 'Recommendations' : 'AI Insights'}</h1>
      <p>${isReco ? 'Actionable recommendations grounded in your data.' : 'Findings the AI surfaced from your dataset.'} <span style="color:var(--muted);">· Powered by Claude AI</span></p>
    </div>
    <div id="ai-body"></div>
  `;
  const body = document.getElementById('ai-body');

  if (state.loadingInsights) {
    body.innerHTML = `<div class="card empty"><span class="loading-spin" style="border-top-color:var(--teal);"></span><p>Claude is analyzing your dataset…</p></div>`;
    return;
  }
  if (state.insights && state.insights.error) {
    body.innerHTML = `
      <div class="card" style="border-color:var(--red);">
        <div style="font-weight:600; color:var(--red); font-size:13px; margin-bottom:6px;">⚠ Claude AI is unavailable</div>
        <p style="font-size:12.5px; color:var(--muted); line-height:1.6; margin:0 0 14px 0;">${esc(state.insights.error)}</p>
        <button class="btn ghost" id="gen-btn">Retry</button>
        <button class="btn ghost" id="ai-config-link" style="margin-left:8px;">AI Engine Config</button>
      </div>`;
    document.getElementById('gen-btn').addEventListener('click', generateInsights);
    document.getElementById('ai-config-link').addEventListener('click', ()=>{ state.page='aiconfig'; render(); });
    return;
  }
  if (!state.insights) {
    body.innerHTML = `
      <div class="card empty">
        <p>No analysis generated yet for this dataset.</p>
        <button class="btn" id="gen-btn">Generate AI Analysis</button>
      </div>`;
    document.getElementById('gen-btn').addEventListener('click', generateInsights);
    return;
  }
  body.innerHTML = `
    <div class="card" style="white-space:pre-wrap; font-size:13.5px; line-height:1.6;">${esc(state.insights.raw)}</div>
    <div style="margin-top:14px;">
      <button class="btn ghost" id="regen-btn">Regenerate</button>
    </div>
  `;
  document.getElementById('regen-btn').addEventListener('click', generateInsights);
}

function renderReport(main){
  main.innerHTML = `
    <div class="pagehead"><h1>Business Report</h1><p>Compiled from your dataset, quality checks, and AI analysis.</p></div>
    <div class="card" id="report-body" style="font-size:13px; line-height:1.7;">
      <h2 style="margin-top:0;">${esc(state.fileName)}</h2>
      <p style="color:var(--muted);">${esc(state.datasetLabel)} · ${state.rows.length} records · ${state.columns.length} columns</p>

      <div class="section-title" style="margin-top:0;">Data Quality</div>
      <p>Score: <b>${state.quality.score}/100</b><br>${state.quality.issues.map(esc).join('<br>')}</p>

      ${state.kpis.length ? `<div class="section-title">KPI Summary</div>
      <table><thead><tr><th>KPI</th><th>Value</th><th>Change</th></tr></thead>
      <tbody>${state.kpis.map(k=>`<tr><td>${esc(k.label)}</td><td>${fmtNum(k.value)}</td><td>${k.change!==null?k.change.toFixed(1)+'%':'—'}</td></tr>`).join('')}</tbody></table>` : ''}

      ${state.anomalies && state.anomalies.length ? `<div class="section-title">Anomalies</div>
      <p>${state.anomalies.map(a=>`${esc(a.column)} row ${a.row}: ${fmtNum(a.value)} (${a.direction})`).join('<br>')}</p>` : ''}

      ${state.insights ? `<div class="section-title">AI Analysis</div><div style="white-space:pre-wrap;">${esc(state.insights.raw)}</div>` :
        `<div class="section-title">AI Analysis</div><p style="color:var(--muted);">Not generated yet — visit AI Insights to generate it, then return here.</p>`}
    </div>
    <div class="row-gap" style="justify-content:flex-start; margin-top:16px;">
      <button class="btn" id="print-btn">Download as PDF</button>
      <button class="btn ghost" id="export-xlsx-btn">Export Cleaned Data (.xlsx)</button>
      <button class="btn ghost" id="export-csv-btn">Export Cleaned Data (.csv)</button>
      <button class="btn ghost" id="download-btn">Download Report (.txt)</button>
    </div>
  `;
  document.getElementById('print-btn').addEventListener('click', () => {
    document.body.classList.add('printing-report');
    window.print();
    setTimeout(() => document.body.classList.remove('printing-report'), 300);
  });
  document.getElementById('export-xlsx-btn').addEventListener('click', () => {
    if (typeof XLSX === 'undefined') { alert('Excel export library failed to load — try the CSV export instead.'); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.rows), 'Cleaned Data');
    if (state.kpis.length) {
      const kpiRows = state.kpis.map(k => ({ KPI:k.label, Value:k.value, Change_Pct: k.change!==null?k.change:'' }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(kpiRows), 'KPIs');
    }
    if (state.anomalies && state.anomalies.length) {
      const anRows = state.anomalies.map(a => ({ Column:a.column, Row:a.row, Value:a.value, Direction:a.direction, Z_Score:a.z }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(anRows), 'Anomalies');
    }
    XLSX.writeFile(wb, (state.fileName||'data').replace(/\.[^.]+$/,'') + '_export.xlsx');
  });
  document.getElementById('download-btn').addEventListener('click', () => {
    const text = document.getElementById('report-body').innerText;
    const blob = new Blob([text], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.fileName||'report').replace(/\.[^.]+$/,'') + '_report.txt';
    a.click();
  });
  document.getElementById('export-csv-btn').addEventListener('click', () => {
    const csv = Papa.unparse(state.rows);
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.fileName||'data').replace(/\.[^.]+$/,'') + '_export.csv';
    a.click();
  });
}

function renderChat(main){
  main.innerHTML = `
    <div class="pagehead"><h1>Ask BizAI</h1><p>Financial and business questions, answered by Claude AI using only your synchronized dataset.</p></div>
    <div class="chat-wrap">
      <div class="chat-log" id="chat-log"></div>
      ${state.chatHistory.length===0 ? `<div class="suggest">
        ${['What are the biggest problems in this data?','What changed recently?','Which category performs best?','Summarize the key numbers for me','Explain the anomalies you found'].map(s=>`<span data-q="${esc(s)}">${esc(s)}</span>`).join('')}
      </div>` : ''}
      <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Ask about your data…">
        <button class="btn" id="send-btn">Send</button>
      </div>
    </div>
  `;
  const log = document.getElementById('chat-log');
  log.innerHTML = state.chatHistory.map(m => {
    if (m.role === 'user') return `<div class="msg user">${esc(m.text)}</div>`;
    if (m.error) return `<div class="msg bot" style="border-color:var(--red); color:var(--red);">⚠ ${esc(m.text)}</div>`;
    return `<div class="msg bot">${esc(m.text)}</div>`;
  }).join('')
    + (state.loadingChat ? `<div class="msg bot"><span class="loading-spin" style="border-top-color:var(--text);"></span> Claude is thinking…</div>` : '');
  log.scrollTop = log.scrollHeight;

  const input = document.getElementById('chat-input');
  const send = () => {
    const v = input.value.trim();
    if (!v || state.loadingChat) return;
    input.value = '';
    sendChatMessage(v);
  };
  document.getElementById('send-btn').addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key==='Enter') send(); });
  document.querySelectorAll('[data-q]').forEach(el => el.addEventListener('click', () => sendChatMessage(el.getAttribute('data-q'))));
}
